<!doctype html>
<title>Crest focus measurement</title>
<!--
  ⚠⚠⚠ THE HARNESS BEHIND CREST_ART IN app/engine/factionCrests.ts.

  Each crest is drawn to a 128x128 canvas and reduced to the LUMINANCE-WEIGHTED
  CENTROID of its artwork, with the near-black ground discounted so the figure
  follows the device rather than the frame around it. That centroid is `focusY`,
  and it is what lets the roster put a window on the SUBJECT of each emblem
  rather than on whatever happens to be in the middle of the file.

  ⚠ RUN IT AFTER REPLACING ANY ART, or the layout keeps aiming at where the old
  picture used to be. Canvas readback needs same-origin pixels, so serve the
  repo rather than opening this off the filesystem:

      npx http-server . -p 8080     # or any static server
      open http://localhost:8080/scripts/measure-crest-focus.html

  Then copy the printed table into CREST_ART. The `aspect` column is checked
  against the real PNG headers by ota1753, so a stale table fails CI rather than
  drifting silently.
-->
<style>
  body { background:#141310; color:#cdbf99; font:13px/1.6 ui-monospace,monospace; padding:24px; }
  img { display:none; }
  pre { background:#0b0c0d; border:1px solid #3C3E3F; padding:16px; overflow-x:auto; }
  h1 { font-size:13px; letter-spacing:2px; color:#E6D8B3; }
</style>
<h1>CREST FOCUS — LUMINANCE-WEIGHTED CENTROID</h1>
<img data-name="conspiracy_architects.png" src="../assets/crests/conspiracy_architects.png">
<img data-name="eternal_dynasty.png" src="../assets/crests/eternal_dynasty.png">
<img data-name="forgotten_order.png" src="../assets/crests/forgotten_order.png">
<img data-name="mud_monarchs.png" src="../assets/crests/mud_monarchs.png">
<img data-name="reclaimers_guild.png" src="../assets/crests/reclaimers_guild.png">
<img data-name="servants_of_giants.png" src="../assets/crests/servants_of_giants.png">
<img data-name="stone_builders.png" src="../assets/crests/stone_builders.png">
<img data-name="tartarian_revivalists.png" src="../assets/crests/tartarian_revivalists.png">
<img data-name="true_tartarians.png" src="../assets/crests/true_tartarians.png">
<pre id="out">measuring…</pre>
<script>
const S = 128;                      // sample grid; ample for a centroid
const GROUND = 0.18;                // below this luminance is frame, not figure
const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
const cx = cv.getContext('2d', { willReadFrequently: true });

function focusOf(img) {
  cx.clearRect(0, 0, S, S);
  cx.drawImage(img, 0, 0, S, S);
  const d = cx.getImageData(0, 0, S, S).data;
  let sw = 0, sy = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const a = d[i + 3] / 255;
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const w = a * Math.max(0, l - GROUND);
    sw += w; sy += w * y;
  }
  return sy / sw / S;
}

const imgs = [...document.querySelectorAll('img')];
Promise.all(imgs.map((im) => im.complete ? null : new Promise((r) => { im.onload = r; im.onerror = r; })))
  .then(() => {
    const lines = imgs.map((im) => {
      const id = im.dataset.name.replace('.png', '');
      if (!im.naturalWidth) return `  // ${id}: FAILED TO LOAD — serve the repo, do not open from file://`;
      const aspect = +(im.naturalHeight / im.naturalWidth).toFixed(3);
      return `  ${id}: { focusY: ${focusOf(im).toFixed(3)}, aspect: ${aspect} },`;
    });
    document.getElementById('out').textContent =
      'const CREST_ART: Readonly<Record<string, CrestArt>> = {\n' + lines.join('\n') + '\n};';
  });
</script>
