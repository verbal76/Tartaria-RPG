name: Generate Upload Keystore

# One-shot keystore generator using keytool on the CI runner. Java
# generates the keystore so Java's gradle signing can read it back.
# Outputs the base64-encoded keystore + SHA1 fingerprint to the run
# log. Manual trigger only.
#
# Usage:
#   1. Actions -> Generate Upload Keystore -> Run workflow
#   2. Wait ~30 sec
#   3. Copy the base64 block from the log
#   4. Update ANDROID_KEYSTORE_BASE64 secret with that value
#   5. (Optional) Decode the base64 to a local file for backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ALIAS="tartaria-upload"
          DNAME="CN=Tartaria Realms, O=Hot Attic Games, C=US"
          OUT=tartaria-upload.jks

          keytool -genkey -v \
            -keystore "$OUT" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 9125 \
            -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -dname "$DNAME"

          echo ""
          echo "=== Keystore generated ==="
          keytool -list -v -keystore "$OUT" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1 \
            | grep -E "Alias name:|SHA1:|SHA-1:|Owner:|Valid from:"
          echo ""

          echo "=== BASE64 START ==="
          base64 -w 0 "$OUT"
          echo ""
          echo "=== BASE64 END ==="

          echo ""
          echo "Next steps:"
          echo "  1. Copy the base64 string between BASE64 START / BASE64 END."
          echo "  2. Update ANDROID_KEYSTORE_BASE64 secret with that value."
          echo "  3. Confirm ANDROID_KEY_ALIAS secret is exactly: tartaria-upload"
          echo "  4. ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD: unchanged (this used your existing password)."
          echo "  5. Push [build-aab] commit to retry the AAB build."
