name: Publish · OTA (one line at a time)

# ⚠ The file is still named eas-update-golem.yml so its run history survives.
# It is no longer golem-only — see OTA-1386 below.
#
# Publishes the trunk's JS bundle as an OTA to ONE product line's EAS channel.
#
# ⚠⚠ THE FIREWALL, AND HOW IT SURVIVED THE COLLAPSE — OTA-1386.
#
# The original guarantee was structural: this file knew ONE string, "golem-line",
# so no code path in it could reach a live playtester channel. Under four
# branches that was enough, because each branch had its own everything.
#
# One trunk means one workflow has to be able to publish four products, so the
# single hardcoded string had to go. The guarantee is kept by SPLITTING THE
# TRIGGERS instead:
#
#   • A PUSH is automatic, unattended, and can only ever publish golem-line —
#     the developer's own test phone. That is asserted below, and a push that
#     somehow named another channel is a hard failure, not a warning.
#   • A DISPATCH is a person choosing a line in the Actions UI. That one may
#     publish to hal / steam / html, because somebody decided to.
#
# So the property that mattered is intact: nothing that happens on its own can
# reach a real player. Only a deliberate button press can.
#
# Trigger: a JS-bundle (app/**) push to the trunk. Native / build-config changes
# are path-ignored here because they need a fresh binary (build-apk.yml via
# workflow_dispatch), not an OTA.

on:
  push:
    branches:
      - golem-line
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      line:
        description: 'Product line to publish to (golem = dev phone; hal/steam/html reach real installs)'
        required: false
        default: 'golem'
        type: choice
        options:
          - golem
          - hal
          - steam
          - html

permissions:
  contents: read

jobs:
  ota:
    name: Publish OTA to one line's channel
    runs-on: ubuntu-latest
    # Belt-and-suspenders — this job only ever runs from the trunk. If anything
    # ever re-points it, it no-ops instead of leaking.
    if: github.ref == 'refs/heads/golem-line'
    env:
      # ⚠ A PUSH has no input and falls to golem. That is the whole automatic
      # path, and it is why an unattended run can never reach a player.
      TARTARIA_LINE: ${{ github.event.inputs.line || 'golem' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.1.0
          token: ${{ secrets.TARTARIATWO }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish OTA to the selected line's channel
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIATWO }}
        run: |
          set -euo pipefail

          # ⚠⚠ THE CHANNEL COMES FROM THE RESOLVED CONFIG, NOT FROM A FILE.
          # The old version read app.json directly. Since OTA-1384 app.json is
          # only the shared BASE — it still says "golem-line" for every line —
          # so reading it would have "verified" golem-line and then published a
          # bundle built as hal. Ask Expo what this build actually is.
          CFG=$(npx expo config --type public --json)
          CHANNEL=$(node -e "const c=JSON.parse(process.argv[1]);process.stdout.write((c.updates&&c.updates.requestHeaders&&c.updates.requestHeaders['expo-channel-name'])||'')" "$CFG")
          APP_VERSION=$(node -e "const c=JSON.parse(process.argv[1]);process.stdout.write(c.version||'')" "$CFG")
          RESOLVED_LINE=$(node -e "const c=JSON.parse(process.argv[1]);process.stdout.write((c.extra&&c.extra.tartariaLine)||'')" "$CFG")

          # ── HARD FENCE ────────────────────────────────────────────────
          # 1. Only ever from the trunk.
          if [ "${GITHUB_REF_NAME}" != "golem-line" ]; then
            echo "::error::Refusing to publish — branch '${GITHUB_REF_NAME}' is not the trunk."
            exit 1
          fi
          # 2. ⚠⚠ AN AUTOMATIC RUN MAY ONLY REACH THE DEV PHONE. This is the
          #    firewall that used to be "this file knows one string". A push
          #    happens with nobody watching; a dispatch is somebody choosing.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$TARTARIA_LINE" != "golem" ]; then
            echo "::error::Refusing to publish — an automatic (push) run may only target golem, got '$TARTARIA_LINE'."
            exit 1
          fi
          # 3. The config must agree with what we asked for. A mismatch means the
          #    env var did not reach Expo, and the bundle is not the product named
          #    in this run's title.
          if [ "$RESOLVED_LINE" != "$TARTARIA_LINE" ]; then
            echo "::error::Config resolved to line '$RESOLVED_LINE' but this run selected '$TARTARIA_LINE'. Aborting."
            exit 1
          fi
          if [ -z "$CHANNEL" ]; then
            echo "::error::No expo-channel-name resolved — the built bundle would reach nobody."
            exit 1
          fi
          # 4. Never a channel no product listens on. These are the legacy /
          #    shared names; publishing to one is a bundle sent into the dark or,
          #    worse, onto a track nobody chose.
          case "$CHANNEL" in
            preview|ios-preview|production|development|arbiters-line)
              echo "::error::Refusing to publish to shared channel '$CHANNEL' — no single product owns it."
              exit 1 ;;
          esac
          # ──────────────────────────────────────────────────────────────

          MSG="OTA ${TARTARIA_LINE} — ${GITHUB_REF_NAME}@${GITHUB_SHA::7} (run #${{ github.run_number }})"

          echo "=== OTA — pre-flight ==="
          echo "Trigger:          ${{ github.event_name }}"
          echo "Line:             $TARTARIA_LINE"
          echo "Channel:          $CHANNEL"
          echo "App version (rt): $APP_VERSION"
          echo "========================"

          set +e
          eas update \
            --branch "$CHANNEL" \
            --message "$MSG" \
            --platform android \
            --non-interactive \
            --json > result.json
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::Publish to '$CHANNEL' failed (exit $rc)."
            cat result.json 2>/dev/null || true
            exit $rc
          fi

          # Map the channel to its same-named branch (idempotent) so the installed
          # build's 'expo-channel-name' header resolves here.
          eas channel:view "$CHANNEL" --non-interactive >/dev/null 2>&1 \
            || eas channel:create "$CHANNEL" --non-interactive 2>&1 || true
          eas channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive 2>&1 \
            || echo "::warning::channel:edit failed for '$CHANNEL' — check the EAS dashboard mapping."

          # Runtime guard — an installed build requests runtimeVersion = app
          # version; a mismatch silently no-ops.
          PUB_RT=$(node -e "const r=JSON.parse(require('fs').readFileSync('result.json','utf8'));const a=Array.isArray(r)?r:[r];console.log(a[0]&&a[0].runtimeVersion||'')")
          if [ "$PUB_RT" != "$APP_VERSION" ]; then
            echo "::error::Published runtimeVersion '$PUB_RT' != app '$APP_VERSION' — the installed build will reject it."
            exit 1
          fi
          echo "✓ Published OTA for line '$TARTARIA_LINE' to channel '$CHANNEL' (android) at runtimeVersion $PUB_RT."
