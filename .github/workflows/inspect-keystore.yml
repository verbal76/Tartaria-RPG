name: Setup · Inspect keystore

# Diagnostic workflow — decodes ANDROID_KEYSTORE_BASE64 from secrets,
# runs `keytool -list` against it, and prints every alias to the run
# log. Manual trigger only; never fires automatically. Use when the
# AAB build is failing on "alias not found" and you need to see the
# exact alias name(s) stored inside the keystore.
#
# The alias name itself is NOT secret — it's printed as part of the
# Android signing cert, visible to anyone who inspects an installed
# APK. The keystore password IS secret and is consumed by keytool
# without being logged.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: List aliases in ANDROID_KEYSTORE_BASE64
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17 (provides keytool)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty. Cannot inspect."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > tartaria-upload.keystore
          echo "Decoded keystore: $(stat -c%s tartaria-upload.keystore) bytes"

      - name: List aliases
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Aliases inside the keystore ==="
          echo ""

          # -list: enumerate entries
          # -v:    verbose (shows fingerprints + creation date)
          # -storepass via stdin so it doesn't appear on the cmdline
          if ! echo "$ANDROID_KEYSTORE_PASSWORD" | keytool -list -v \
              -keystore tartaria-upload.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1; then
            echo ""
            echo "::error::keytool -list failed. Most likely ANDROID_KEYSTORE_PASSWORD doesn't match this keystore."
            exit 1
          fi

          echo ""
          echo "=== Summary — just the alias names ==="
          keytool -list -keystore tartaria-upload.keystore -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null \
            | grep -E "^[a-zA-Z]" | grep -v "Keystore" | grep -v "Your keystore" || true

          echo ""
          echo "Look for a line in the verbose output above that begins with 'Alias name:'."
          echo "That exact string (case-sensitive) is what your ANDROID_KEY_ALIAS secret must equal."
