name: EAS Update (OTA - Tartaria Realms)

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update channel/branch to publish to'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

permissions:
  contents: read

jobs:
  update:
    name: Publish Tartaria OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.TARTARIA }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish OTA update to Tartaria Realms
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIA }}
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.branch || 'preview' }}"
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          MSG="Tartaria Realms OTA — ${BRANCH}@${SHORT_SHA} (run #${{ github.run_number }})"

          echo "=== OTA publish — pre-flight ==="
          echo "Channel:      $CHANNEL"
          echo "Message:      $MSG"
          echo "Project id:   $(node -p "require('./app.json').expo.extra.eas.projectId")"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          RT_POLICY=$(node -p "require('./app.json').expo.runtimeVersion.policy || ''")
          echo "App version:  $APP_VERSION"
          echo "RT policy:    $RT_POLICY"
          # With policy 'appVersion' the runtime version resolves to app.json's
          # version. The APK on device was built with the same value, so this
          # is what OTAs must publish at to actually land.
          echo "Expected runtimeVersion the APK is asking for: $APP_VERSION"
          echo "================================="

          # Force --platform android — we don't ship iOS yet, and iOS asset
          # quirks can fail the whole update otherwise.
          eas update \
            --branch "$CHANNEL" \
            --message "$MSG" \
            --platform android \
            --non-interactive \
            --json \
            > update-result.json

          echo "=== OTA publish — result ==="
          cat update-result.json | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const arr = Array.isArray(r) ? r : [r];
            for (const u of arr) {
              console.log("  id:              " + (u.id || u.updateId || "?"));
              console.log("  group:           " + (u.group || "?"));
              console.log("  platform:        " + (u.platform || "?"));
              console.log("  runtimeVersion:  " + (u.runtimeVersion || "?"));
              console.log("  branch:          " + (u.branch || (u.branchName) || "?"));
              console.log("  manifestPermalink: " + (u.manifestPermalink || "?"));
            }
          '
          echo "============================"

          # GUARDRAIL — assert the published runtimeVersion matches app.json's
          # local version. With eas.json appVersionSource=local this is the
          # contract the APK relies on. If they drift, FAIL the build so we
          # see it instead of an OTA that publishes silently to a runtime
          # the installed APK doesn't request.
          PUBLISHED_RT=$(node -e '
            const r = JSON.parse(require("fs").readFileSync("update-result.json", "utf8"));
            const arr = Array.isArray(r) ? r : [r];
            console.log(arr[0] && arr[0].runtimeVersion || "");
          ')
          if [ -z "$PUBLISHED_RT" ]; then
            echo "::error::OTA publish returned no runtimeVersion. Publish probably did not land."
            exit 1
          fi
          if [ "$PUBLISHED_RT" != "$APP_VERSION" ]; then
            echo "::error::Published runtimeVersion '$PUBLISHED_RT' does not match app.json version '$APP_VERSION'."
            echo "::error::The installed APK requests runtimeVersion '$APP_VERSION' and will silently reject this update."
            echo "::error::Fix: either bump app.json version + rebuild APK, or align eas.json appVersionSource."
            exit 1
          fi
          echo "✓ Runtime version match: APK requests $APP_VERSION, OTA published at $PUBLISHED_RT."
