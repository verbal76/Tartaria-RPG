name: EAS Update (OTA - Tartaria Realms)

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update channel/branch to publish to'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

permissions:
  contents: read

jobs:
  update:
    name: Publish Tartaria OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.TARTARIA }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish OTA update to Tartaria Realms
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIA }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event_name }}
        run: |
          CHANNEL="${{ github.event.inputs.branch || 'preview' }}"
          MSG=$(echo "$COMMIT_MSG" | head -1)
          echo "Publishing Tartaria Realms OTA to channel: $CHANNEL — $MSG"
          eas update \
            --branch "$CHANNEL" \
            --message "$MSG" \
            --non-interactive
