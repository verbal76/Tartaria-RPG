name: Publish · OTA update (mobile)

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
      - 'HaL2001'
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS update channel/branch to publish to (ignored — multi-channel publish runs regardless)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - hal2001
          - ios-preview
          - production
          - development

permissions:
  contents: read

jobs:
  update:
    name: Publish Tartaria OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          # Pinned. 16.6.1 (late 2024) turned out to be too old for
          # the current Expo backend's expectations — auth step would
          # succeed but publish steps could fail with stale-API
          # errors. Bumped to the last 18.x major (Feb 2025) which is
          # the most-recent series before the broken 19.0.8 (run #404).
          # Bump again deliberately after confirming the new version
          # still auth-validates against the project token.
          eas-version: 18.1.0
          token: ${{ secrets.TARTARIATWO }}

      # Diagnostic step — print env health so the next CI failure has
      # actionable output instead of a bare exit 1. Token value never
      # gets logged; we just confirm it was provided and has the
      # right shape.
      - name: EAS auth diagnostic (non-failing)
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIATWO }}
        run: |
          set +e
          echo "=== EAS auth diagnostic ==="
          echo "eas-cli version:    $(eas --version 2>&1 || echo '(not on PATH)')"
          echo "Token provided:     $([ -n \"$EXPO_TOKEN\" ] && echo yes || echo NO)"
          echo "Token length:       $(printf %s \"$EXPO_TOKEN\" | wc -c)"
          echo "Whoami:"
          eas whoami 2>&1 || echo "::warning::eas whoami failed — token may be expired or revoked. Regenerate at https://expo.dev → Account → Access Tokens, then update the TARTARIATWO GitHub secret."
          echo "==========================="
          set -e

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish OTA update to Tartaria Realms (multi-channel)
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIATWO }}
          # OTA-283 — commit-message platform gates. Read the head
          # commit message through env (NOT ${{ }} interpolation —
          # multi-line messages with quotes/newlines blow up the
          # script otherwise). Used by the HaL2001 case below to
          # skip one platform when [ota-ios-only] or [ota-android-only]
          # is in the commit title or body.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # 2026-05-26 — multi-channel publish. Per playtester
          # request: every OTA push should land on hal2001 (Android
          # experimental), preview (Android live testers), and
          # ios-preview (queued for the iOS Internal Distribution
          # build that's still in the Apple Dev enrolment window).
          # iOS publish is best-effort (continue-on-error) because
          # no iOS bundle is being consumed yet; a publish-side
          # iOS issue should warn-not-fail the Android publishes.
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          MSG="Tartaria Realms OTA — ${BRANCH}@${SHORT_SHA} (run #${{ github.run_number }})"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          RT_POLICY=$(node -p "require('./app.json').expo.runtimeVersion.policy || ''")
          PROJECT_ID=$(node -p "require('./app.json').expo.extra.eas.projectId")

          echo "=== OTA publish — pre-flight ==="
          echo "Branch:       $BRANCH"
          echo "Message:      $MSG"
          echo "Project id:   $PROJECT_ID"
          echo "App version:  $APP_VERSION"
          echo "RT policy:    $RT_POLICY"
          echo "Channels:     hal2001 (android) + preview (android) + ios-preview (ios, best-effort)"
          # With policy 'appVersion' the runtime version resolves to
          # app.json's version. The APK on device was built with the
          # same value, so this is what OTAs must publish at to
          # actually land.
          echo "Expected runtimeVersion the APK is asking for: $APP_VERSION"
          echo "================================="

          # Helper — publish to one (channel, platform) and assert
          # the runtime version matches app.json. The third arg
          # marks the publish as best-effort: failures warn and
          # return 0 instead of failing the job. Used for the
          # iOS publish until the iOS build lands.
          publish_channel() {
            local channel="$1"
            local platform="$2"
            local optional="${3:-false}"
            local result_file="result-${channel}-${platform}.json"

            echo ""
            echo "--- Channel '$channel' ($platform) ---"

            set +e
            eas update \
              --branch "$channel" \
              --message "$MSG" \
              --platform "$platform" \
              --non-interactive \
              --json \
              > "$result_file"
            local update_exit=$?
            set -e

            if [ $update_exit -ne 0 ]; then
              if [ "$optional" = "true" ]; then
                echo "::warning::Optional publish to channel '$channel' ($platform) failed (exit $update_exit). Continuing — Android channels still publish."
                return 0
              fi
              echo "::error::Publish to channel '$channel' ($platform) failed (exit $update_exit)."
              return $update_exit
            fi

            # Channel-to-branch mapping. EAS Update routes a device's
            # 'expo-channel-name: X' header to whichever branch the
            # channel X is mapped to. We ensure mapping every run —
            # idempotent if it already matches.
            set +e
            eas channel:view "$channel" --non-interactive > /dev/null 2>&1
            local view_exit=$?
            set -e
            if [ $view_exit -ne 0 ]; then
              echo "Channel '$channel' does not exist — creating."
              eas channel:create "$channel" --non-interactive 2>&1 \
                || echo "::warning::channel:create returned non-zero for '$channel' (may already exist)"
            fi
            eas channel:edit "$channel" --branch "$channel" --non-interactive 2>&1 \
              || echo "::warning::channel:edit failed for '$channel' — mapping may need manual fix in the EAS dashboard"

            # Echo per-publish result summary (id, group, runtime).
            node -e "
              const r = JSON.parse(require('fs').readFileSync('$result_file', 'utf8'));
              const arr = Array.isArray(r) ? r : [r];
              for (const u of arr) {
                console.log('  id:              ' + (u.id || u.updateId || '?'));
                console.log('  group:           ' + (u.group || '?'));
                console.log('  platform:        ' + (u.platform || '?'));
                console.log('  runtimeVersion:  ' + (u.runtimeVersion || '?'));
                console.log('  branch:          ' + (u.branch || u.branchName || '?'));
                console.log('  manifestPermalink: ' + (u.manifestPermalink || '?'));
              }
            "

            # Runtime-version guard. If the published rt doesn't match
            # app.json's version, the installed APK silently rejects
            # the update — fail loud so we see it.
            local published_rt
            published_rt=$(node -e "
              const r = JSON.parse(require('fs').readFileSync('$result_file', 'utf8'));
              const arr = Array.isArray(r) ? r : [r];
              console.log(arr[0] && arr[0].runtimeVersion || '');
            ")
            if [ -z "$published_rt" ]; then
              if [ "$optional" = "true" ]; then
                echo "::warning::Optional channel '$channel' ($platform): publish returned no runtimeVersion."
                return 0
              fi
              echo "::error::Channel '$channel' ($platform): publish returned no runtimeVersion."
              return 1
            fi
            if [ "$published_rt" != "$APP_VERSION" ]; then
              if [ "$optional" = "true" ]; then
                echo "::warning::Optional channel '$channel' ($platform): rt='$published_rt' != app='$APP_VERSION'."
                return 0
              fi
              echo "::error::Channel '$channel' ($platform): published rt='$published_rt' != app='$APP_VERSION'."
              echo "::error::The installed APK requests runtimeVersion '$APP_VERSION' and will silently reject this update."
              return 1
            fi
            echo "✓ Channel '$channel' ($platform): published at runtimeVersion $published_rt."
          }

          # OTA-283 — parse platform-specific publish markers from the
          # commit message. [ota-ios-only] in the title or body skips
          # the Android publish; [ota-android-only] skips the iOS
          # publish. Default: neither, both publish. Used by the
          # HaL2001 case below to avoid pushing a bundle to a platform
          # the fix doesn't apply to (player feedback: don't churn
          # OTA bundles on devices that don't need them).
          IOS_ONLY=false
          ANDROID_ONLY=false
          if echo "$COMMIT_MSG" | grep -q '\[ota-ios-only\]'; then
            IOS_ONLY=true
          fi
          if echo "$COMMIT_MSG" | grep -q '\[ota-android-only\]'; then
            ANDROID_ONLY=true
          fi
          if [ "$IOS_ONLY" = "true" ] && [ "$ANDROID_ONLY" = "true" ]; then
            echo "::warning::Both [ota-ios-only] AND [ota-android-only] markers found — ignoring both, publishing to both platforms."
            IOS_ONLY=false
            ANDROID_ONLY=false
          fi
          echo "Platform-marker state:  IOS_ONLY=$IOS_ONLY  ANDROID_ONLY=$ANDROID_ONLY"

          # 2026-05-30 — branch-isolated publish. Each source branch
          # publishes ONLY to its own channel, so no branch's OTA can
          # ever reach another branch's testers. On HaL2001 this means
          # hal2001 ONLY — HaL never publishes to preview (live testers)
          # or ios-preview, and (paired with the dev-side change) nothing
          # from dev publishes to hal2001. hal2001 is fully isolated.
          case "$BRANCH" in
            claude/new-session-MvF82)
              publish_channel "preview" "android" false
              ;;
            HaL2001)
              # OTA-276 — also publish iOS to hal2001. The first iOS
              # TestFlight build (OTA-265 / Stone Mantle) was baked
              # with `expo-channel-name: hal2001` in app.json, so the
              # iOS install asks the Expo server for hal2001-iOS
              # bundles. Without this iOS publish line, every HaL2001
              # OTA was Android-only and iOS testers were silently
              # stuck on whatever bundle their TestFlight build was
              # compiled with (no error — Expo server correctly
              # returns "no update available" for iOS hal2001).
              # Best-effort (optional=true) so iOS publish failure
              # never blocks the Android publish that's been the
              # workhorse for months.
              # OTA-283 — platform-specific publish markers. Commit
              # message can include [ota-ios-only] (skip Android
              # publish) or [ota-android-only] (skip iOS publish) for
              # platform-targeted fixes. Markers parsed above into
              # IOS_ONLY / ANDROID_ONLY booleans. Default behavior
              # (both platforms) when neither marker present.
              if [ "${ANDROID_ONLY:-false}" = "true" ]; then
                echo "::notice::[ota-android-only] marker found — skipping iOS publish for hal2001 channel."
                publish_channel "hal2001" "android" false
              elif [ "${IOS_ONLY:-false}" = "true" ]; then
                echo "::notice::[ota-ios-only] marker found — skipping Android publish for hal2001 channel."
                publish_channel "hal2001" "ios" true
                # OTA-303 — iOS OTA route fix. The production iOS TestFlight
                # build is stamped channel "preview" (eas.json production
                # profile), NOT hal2001, so the hal2001 iOS publish above never
                # reached it ("Last OTA applied: No" on the iPad). Also publish
                # iOS to the preview channel so the installed iOS build receives
                # OTAs. Platform-scoped (ios) — does NOT touch preview→android
                # (Android live testers), so branch isolation for Android holds.
                publish_channel "preview" "ios" true
              else
                publish_channel "hal2001" "android" false
                publish_channel "hal2001" "ios" true
                # OTA-303 — see note above: reach the iOS build that polls the
                # "preview" channel (ios platform only).
                publish_channel "preview" "ios" true
              fi
              ;;
            iOS-initial)
              publish_channel "ios-preview" "ios" true
              ;;
            *)
              echo "::notice::Branch '$BRANCH' is not mapped to an OTA channel — skipping publish (no cross-branch broadcast)."
              ;;
          esac

          echo ""
          echo "=== Branch-isolated publish complete ==="
