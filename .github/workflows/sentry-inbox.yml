# ⚠⚠ SENTRY INBOX RELAY — why this exists.
#
# The owner's SEND LOG button (OTA-1489) ships player-log bundles to Sentry,
# but the cloud workspace Claude works in has a fixed egress policy that does
# not include sentry.io, so it cannot read them back directly. CI runners can.
# This workflow pulls the recent player-log events + their attachments from
# Sentry and commits them under sentry-inbox/, where the workspace CAN read
# them (git pull). Trigger: push a change to sentry-inbox/request.txt.
#
# Requires the repo secret SENTRY_READ_TOKEN (a read-scoped Sentry token).
# The token never appears in the tree; the fetched artifacts are the owner's
# own diagnostics from his own devices.
#
# ⚠ The OTA publish workflow must ignore sentry-inbox/** (it does, same
# commit that added this file) — an inbox sync is not a game update.
name: Sentry inbox sync

on:
  push:
    branches: [golem-line]
    paths: ['sentry-inbox/request.txt']
  # ⚠ 2026-08-26 — THE HOURLY CLOCK, on the owner's word: "we need to set you
  # to pull all sentry when I start a new session or periodically." A session
  # start can't be hooked server-side, so the relay pulls on its own schedule
  # and commits anything new — whichever session opens next just `git pull`s
  # and the evidence is already in the tree. Quiet hours cost nothing: no new
  # events → no commit (the "Nothing new" branch below).
  #
  # ⚠⚠ THIS CLOCK ONLY TICKS FROM THE DEFAULT BRANCH. GitHub reads `schedule:`
  # from the workflow file as it exists on the repo's DEFAULT branch (`main`)
  # — never from a topic branch. Added here on golem-line 2026-08-26 at 01:14,
  # it fired ZERO times in the twelve hours that followed; every run in the
  # history was a push. A copy of this file must live on `main` for the hour
  # to mean anything, which is why the checkout below pins the ref: a
  # schedule firing from main must still read and write GOLEM-LINE's tree.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # ⚠ ALWAYS golem-line, whatever fired us. A scheduled run launched from
      # the default branch would otherwise check out `main` and try to commit
      # the inbox there — the evidence has to land where the work lives.
      - uses: actions/checkout@v4
        with:
          ref: golem-line
      - name: Pull player-log bundles from Sentry
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          ORG: hot-attic-games-llc
          BASE: https://us.sentry.io/api/0
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, pathlib, re

          tok = os.environ['SENTRY_READ_TOKEN']
          org = os.environ['ORG']
          base = os.environ['BASE']

          def api(path, raw=False, with_headers=False):
              req = urllib.request.Request(path if path.startswith('http') else base + path)
              req.add_header('Authorization', 'Bearer ' + tok)
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
                  headers = dict(r.headers)
              body = data if raw else json.loads(data)
              return (body, headers) if with_headers else body

          # ⚠⚠⚠ 2026-08-27 — FOLLOW THE CURSOR. THE RELAY WAS READING PAGE ONE
          # AND CALLING IT THE TRUTH. Sentry's events endpoint returns at most
          # 100 rows and paginates with a `Link: rel="next"` cursor header. This
          # reader never looked at that header, so on any sync where more than a
          # hundred events had landed, everything older than the newest hundred
          # was invisible — and reported as MISSING parts, which reads exactly
          # like a send that died on the device.
          #
          # ⚠⚠ IT COST THE OWNER HIS ANSWER. He asked where sixty tiles of travel
          # went. The 03:0x sync fetched EXACTLY 100 event dirs; his four sends
          # were ~120 events. His character's bundle went out FIRST, so its parts
          # were the oldest, so they fell off the end of page one:
          #
          #   mtaxtx2bzl8l: 5/27 parts — have 20,21,22,23,26, missing 1-19,24,25,27
          #
          # The late parts arrived and the early ones did not, which is backwards
          # for a send dying mid-flight and is the signature of a truncated page.
          # Nothing was lost on the device or dropped by Sentry; this reader
          # simply stopped asking. `mtawqdrsm78g` at 3/23 is the same wound.
          #
          # ⚠ A CAP THAT LIES IS WORSE THAN A CAP THAT COMPLAINS. The page walk is
          # bounded — an unbounded one against a busy project would run for
          # hours — but if the bound is ever hit, it SAYS so, loudly, instead of
          # returning a short list that looks complete.
          page_audit = {}
          fetch_notes = []
          def api_all(path, max_pages=40):
              rows, url, pages = [], path, 0
              while url and pages < max_pages:
                  batch, headers = api(url, with_headers=True)
                  if not isinstance(batch, list):
                      return batch
                  rows.extend(batch)
                  pages += 1
                  url = None
                  for part in (headers.get('Link') or '').split(','):
                      # <https://…>; rel="next"; results="true"; cursor="…"
                      if 'rel="next"' in part and 'results="true"' in part:
                          lo, hi = part.find('<'), part.find('>')
                          if lo != -1 and hi > lo:
                              url = part[lo + 1:hi]
                          break
              page_audit[path] = (pages, len(rows), bool(url))
              if url:
                  print(f'  ⚠⚠ PAGE CAP HIT after {pages} pages of {path} — '
                        f'{len(rows)} rows read and MORE REMAIN. Raise max_pages; '
                        f'any "MISSING parts" below may be this, not the device.')
              return rows

          out_root = pathlib.Path('sentry-inbox')
          projects = api(f'/organizations/{org}/projects/')
          print('projects:', [q['slug'] for q in projects])
          fetched = []
          for p in projects:
              slug = p['slug']
              try:
                  events = api_all(f'/projects/{org}/{slug}/events/?full=false')
              except Exception as e:
                  print(f'{slug}: events list failed: {e}')
                  continue
              # ⚠ A count of exactly 100 used to be the silent failure mode. Say
              # the number every run so a page boundary can never masquerade as
              # "that is all there was".
              print(f'{slug}: {len(events)} events from the project feed')

              # ⚠⚠⚠ AND THEN GO ROUND THE OTHER SIDE, BECAUSE THAT FEED IS CAPPED.
              # /projects/…/events/ returns the most recent 100 and offers no
              # cursor past them — it reports "no next page" exactly as a genuinely
              # exhausted listing would. That cap is what hid the owner's log: his
              # character's bundle was sent first, so its parts were the oldest,
              # so they sat just beyond the hundred and the reader declared them
              # missing. Twice.
              #
              # ⚠⚠ THE ISSUE FEED DOES PAGINATE. Every player-log part groups into
              # an issue, and /organizations/…/issues/{id}/events/ walks a real
              # cursor to the end. So: take the project feed for recency, then
              # walk every issue for depth, and union them by event id. Slower,
              # and it is the difference between reading the evidence and guessing
              # about it.
              try:
                  issues = api_all(f'/projects/{org}/{slug}/issues/?statsPeriod=90d')
              except Exception as e:
                  issues = []
                  # ⚠⚠ 2026-08-27 — THIS FAILURE USED TO VANISH. The issue walk was
                  # added to reach past the project feed's 100-row cap, it threw,
                  # and the only trace was one print buried mid-log — so VERDICT.txt
                  # showed a single capped listing and no hint that the deeper read
                  # had not happened at all. A fallback that fails silently is a
                  # fallback you believe in for no reason.
                  fetch_notes.append(f'issue list FAILED for {slug}: {e}')
                  print(f'{slug}: issue list failed: {e}')
              seen_ids = {e.get('eventID') for e in events}
              for iss in issues:
                  iid = iss.get('id')
                  if not iid:
                      continue
                  try:
                      iev = api_all(f'/organizations/{org}/issues/{iid}/events/?full=false')
                  except Exception as e:
                      fetch_notes.append(f'issue {iid} events FAILED: {e}')
                      print(f'  issue {iid} ({iss.get("title", "")[:40]}): events failed: {e}')
                      continue
                  added = 0
                  for e in iev:
                      if e.get('eventID') and e['eventID'] not in seen_ids:
                          seen_ids.add(e['eventID'])
                          events.append(e)
                          added += 1
                  if added:
                      print(f'  issue {iid} ({iss.get("title", "")[:50]}): +{added} events')
              print(f'{slug}: {len(events)} events after walking {len(issues)} issues')
              for ev in events[:8]:
                  print(f'  seen: title={ev.get("title")!r} message={ev.get("message")!r} id={ev.get("eventID","")[:8]} at={ev.get("dateCreated")}')
              for ev in events:
                  # ⚠ EVERYTHING is the owner's own diagnostics — player-log
                  # bundles AND the crash-ledger reports (the six native-death
                  # events were the first proof the whole pipeline works).
                  title = ' '.join(str(x) for x in [ev.get('title'), ev.get('message')])
                  kind = 'player-log' if 'player-log' in title else 'crash'
                  eid = ev['eventID']
                  stamp = (ev.get('dateCreated') or '').replace(':', '-')[:19]
                  safe = re.sub(r'[^A-Za-z0-9_-]', '_', f'{kind}_{stamp}_{eid[:12]}')
                  d = out_root / safe
                  if (d / 'event.json').exists():
                      continue  # already synced on a previous run
                  d.mkdir(parents=True, exist_ok=True)
                  try:
                      full = api(f'/projects/{org}/{slug}/events/{eid}/')
                  except Exception as e:
                      print(f'{eid}: full event fetch failed: {e}')
                      full = {'title': title, 'eventID': eid, 'dateCreated': ev.get('dateCreated'),
                              'tags': ev.get('tags'), 'project': slug}
                  (d / 'event.json').write_bytes(json.dumps(full, indent=2).encode())
                  try:
                      atts = api(f'/projects/{org}/{slug}/events/{eid}/attachments/')
                  except Exception as e:
                      print(f'{eid}: attachment list failed: {e}')
                      continue
                  for a in atts:
                      name = re.sub(r'[^A-Za-z0-9._-]', '_', a.get('name') or a['id'])
                      blob = api(f'/projects/{org}/{slug}/events/{eid}/attachments/{a["id"]}/?download=1', raw=True)
                      (d / name).write_bytes(blob)
                      print(f'{safe}/{name}: {len(blob)} bytes')
                  fetched.append(safe)
          print('fetched:', fetched or 'nothing new')

          # ⚠⚠⚠ OTA-1515 — REASSEMBLE THE PARTS. A chunked send arrives as N
          # separate events, each with one slice of the log, all sharing a
          # `bundleId` tag and carrying their own `part`/`parts`. Twenty
          # fragments in twenty directories is not evidence anyone can read, so
          # stitch them back into one file per bundle, IN ORDER, and say plainly
          # which parts are missing rather than silently concatenating a hole.
          def tagval(ev, key):
              for t in (ev.get('tags') or []):
                  if isinstance(t, dict) and t.get('key') == key:
                      return str(t.get('value'))
              return None

          bundles = {}
          for d in sorted(out_root.glob('player-log_*')):
              ev_path = d / 'event.json'
              if not ev_path.exists():
                  continue
              try:
                  ev = json.loads(ev_path.read_text())
              except Exception:
                  continue
              bid = tagval(ev, 'bundleId')
              part = tagval(ev, 'part')
              parts = tagval(ev, 'parts')
              if not bid or not part or not parts:
                  continue
              slices = sorted(d.glob('game-log.part*'))
              if not slices:
                  continue
              bundles.setdefault(bid, {'total': int(parts), 'seen': {}})
              try:
                  bundles[bid]['seen'][int(part)] = slices[0].read_text(errors='replace')
              except Exception as e:
                  print(f'  part {part} of {bid} unreadable: {e}')

          # ⚠⚠⚠ OTA-1518 — THE INLINE PARTS CARRY THEIR TEXT IN THE EVENT, NOT AS
          # A FILE. Every attachment-bearing send has failed for two days while
          # every attachment-free one landed, so the log now rides in the event
          # body. Same bundleId/part/parts tags, so the same stitcher works —
          # it just has to look in `extra.chunk` instead of on disk. The BEACON
          # (kind=player-log-beacon) is the experiment's answer all by itself:
          # if it is here, attachment-free sending works.
          def extraval(ev, key):
              for e in (ev.get('entries') or []):
                  if e.get('type') == 'extra' or e.get('type') == 'context':
                      d = e.get('data') or {}
                      if key in d:
                          return d[key]
              ctx = ev.get('context') or {}
              return ctx.get(key)

          # ⚠⚠⚠ OTA-1520 — READ `_meta`, BECAUSE SENTRY HAS BEEN NAMING THE RULE
          # ALL ALONG AND THIS READER NEVER LOOKED. On 2026-08-27 nine of the
          # forty-nine parts arrived as the literal string `[Filtered]` and were
          # stitched into the assembled log as if they were text — 135,000
          # characters of the owner's session replaced by a ten-character
          # apology, with nothing anywhere saying so. Every one of those events
          # carried the reason, synced into this very tree:
          #
          #   context.chunk."" = {"len": 15000, "rem": [["@password:filter","s",0,10]]}
          #
          # `@password:filter` is a DEFAULT Sentry rule, tested against the VALUE
          # (PatternType::KeyValue), with NO word boundaries, replacing the WHOLE
          # value on a hit — `secret` inside "the secret door", `auth` inside
          # "authored by". Verified both ways before anything was changed: the
          # 588,818 surviving characters contain ZERO matches of that pattern,
          # and the game's own prose carries `authored` ×246 and `secret` ×35.
          #
          # So no redaction is ever anonymous again: whatever the rule, print its
          # id, where it struck, and what it cost in characters.
          def scrub_notes(ev, field):
              meta = ((ev.get('_meta') or {}).get('context') or {}).get(field) or {}
              out = []
              if not isinstance(meta, dict):
                  return out
              def rems(where, ann):
                  if isinstance(ann, dict):
                      for rem in (ann.get('rem') or []):
                          if isinstance(rem, list) and rem:
                              out.append((where, str(rem[0]), int(ann.get('len') or 0)))
              for k, v in meta.items():
                  if k == '':
                      rems('whole part', v)            # a scalar `chunk` (pre-1520)
                  elif isinstance(v, dict):
                      rems(f'block {k}', v.get(''))    # one element of `chunkBlocks`
              return out

          beacons = []
          scrubbed = {}   # bundleId -> [(part, rule_id, chars_lost)]
          short = []      # (bundleId, part, declared, rebuilt)
          for d in sorted(out_root.glob('player-log_*')):
              ev_path = d / 'event.json'
              if not ev_path.exists():
                  continue
              try:
                  ev = json.loads(ev_path.read_text())
              except Exception:
                  continue
              title = ' '.join(str(x) for x in [ev.get('title'), ev.get('message')])
              bid = tagval(ev, 'bundleId')
              if 'beacon' in title or tagval(ev, 'kind') == 'player-log-beacon':
                  if bid:
                      beacons.append(bid)
                  continue
              part, parts = tagval(ev, 'part'), tagval(ev, 'parts')
              if not bid or not part or not parts:
                  continue
              # ⚠⚠ OTA-1520 sends the slice as an ARRAY of ~400-char blocks so a
              # whole-value redaction costs one block instead of one part. Events
              # synced BEFORE 1520 still carry a single `chunk` scalar and must
              # keep reassembling — the evidence that found this fault is in them.
              blocks = extraval(ev, 'chunkBlocks')
              if isinstance(blocks, list):
                  field = 'chunkBlocks'
                  chunk = ''.join(b for b in blocks if isinstance(b, str))
              else:
                  field = 'chunk'
                  chunk = extraval(ev, 'chunk')
              if not isinstance(chunk, str):
                  continue
              for where, rule, lost in scrub_notes(ev, field):
                  scrubbed.setdefault(bid, []).append((int(part), rule, lost))
                  print(f'  ⚠ SCRUBBED: {bid} part {part}, {where} — {rule} took {lost} chars')
              # ⚠ The declared length is the only defence against a SILENT loss.
              # A redaction, an event trim or a dropped block all surface here as
              # a shortfall instead of as a seamless join.
              # ⚠ COUNT IN UTF-16 UNITS, NOT PYTHON CHARACTERS. `chunkChars` is
              # JavaScript's `.length`, which counts UTF-16 code units; Python
              # counts code points. One astral character — an emoji, a rare
              # glyph — is 2 units and 1 code point, so a naive comparison
              # reports a phantom "1 lost" forever. The first run of this check
              # did exactly that on part 2 of mtawqnivyk0q. A watchdog that cries
              # wolf on clean parts is worse than none: it teaches you to skip it.
              declared = extraval(ev, 'chunkChars')
              got = len(chunk.encode('utf-16-le')) // 2
              if isinstance(declared, int) and declared != got:
                  short.append((bid, int(part), declared, got))
              bundles.setdefault(bid, {'total': int(parts), 'seen': {}})
              bundles[bid]['seen'].setdefault(int(part), chunk)
          if short:
              print('  ⚠⚠ SHORT PARTS (declared chars != reassembled chars):')
              for bid, part, declared, got in sorted(short):
                  print(f'     {bid} part {part}: declared {declared}, rebuilt {got} — {declared - got} lost')
          if scrubbed:
              print('  ⚠⚠ SCRUB TOTALS — what Sentry took, and under which rule:')
              for bid, notes in sorted(scrubbed.items()):
                  rules = sorted(set(r for _, r, _ in notes))
                  print(f'     {bid}: {len(notes)} redactions, {sum(l for _, _, l in notes)} chars, rules {rules}')
          if beacons:
              print('  ⚠ BEACONS ARRIVED (attachment-free sending WORKS):', sorted(set(beacons)))
          else:
              print('  ⚠ no beacons yet')

          for bid, b in bundles.items():
              total = b['total']
              have = sorted(b['seen'])
              missing = [n for n in range(1, total + 1) if n not in b['seen']]
              dest = out_root / f'assembled_{bid}'
              dest.mkdir(parents=True, exist_ok=True)
              text = ''.join(b['seen'][n] for n in have)
              (dest / 'game-log.txt').write_text(text)
              note = f'bundle {bid}: {len(have)}/{total} parts, {len(text)} chars'
              if missing:
                  note += f' — MISSING {missing}'
              # ⚠⚠ OTA-1520 — A SCRUBBED HOLE IS NOT A COMPLETE LOG, and until
              # today the README said "27/27 parts" over a file with 135,000
              # characters cut out of it. Say what was taken, right here.
              if bid in scrubbed:
                  notes = scrubbed[bid]
                  note += (f' — SCRUBBED: {len(notes)} redactions cost {sum(l for _, _, l in notes)} chars'
                           f' (parts {sorted(set(p for p, _, _ in notes))},'
                           f' rules {sorted(set(r for _, r, _ in notes))})')
              (dest / 'README.txt').write_text(note + chr(10))
              print('  assembled:', note)

          # ⚠⚠ 2026-08-25 — THE OUTCOMES LEDGER, because "sent" and "kept" are
          # different facts. Tonight the owner's SEND LOG showed sent (the
          # client got its acknowledgment) and the events never appeared in the
          # project: Sentry accepts an envelope at the door and can still drop
          # it server-side (quota, rate limit, spike protection, filters) —
          # visible ONLY in the org outcome stats. Print accepted vs dropped by
          # reason for the last 24h so a silent discard can never again read
          # as "the device never sent it".
          # ⚠⚠⚠ OTA-1515 AUDIT — 24h WAS TOO SHORT A LENS, and that is why this
          # hunt stalled. A CLIENT-SIDE rate limit is cached by the SDK from a
          # 429 it saw EARLIER and then silently drops that category's items
          # for the whole window — which can be a month on a quota. Reading
          # only the last day showed "accepted / error" and nothing else, which
          # looks like health and is actually the sound of attachments being
          # thrown away before they leave the phone. Widen the lens and print
          # EVERY outcome, not just the ones that arrived: rate_limited,
          # filtered, invalid, client_discard (the SDK's own confession that it
          # dropped something locally) all name different faults.
          # ⚠⚠⚠ OTA-1520 — THE SCRUBBER'S OWN SETTINGS, printed rather than
          # assumed. `@password:filter` reached the log because `dataScrubber` +
          # `dataScrubberDefaults` are on and nothing exempts the field. The app
          # side of the fix (blocks instead of one 15,000-char scalar) caps the
          # damage at ~400 characters per hit and cannot be undone by a settings
          # change — but the loss goes to ZERO the moment `chunkBlocks` is listed
          # under the project's SAFE FIELDS, and that is the owner's switch to
          # throw, not this token's (it is read-scoped by design). So print the
          # live values every run: when he adds it, the next sync proves it took,
          # and if it is ever removed the next sync says so instead of quietly
          # losing prose again.
          for p in projects:
              slug = p['slug']
              try:
                  cfg = api(f'/projects/{org}/{slug}/')
              except Exception as e:
                  print(f'── scrubbing config for {slug}: fetch failed: {e}')
                  continue
              print(f'── scrubbing config for {slug}:')
              for k in ('dataScrubber', 'dataScrubberDefaults', 'scrubIPAddresses',
                        'sensitiveFields', 'safeFields'):
                  print(f'  {k}: {cfg.get(k)!r}')
              rp = cfg.get('relayPiiConfig')
              print(f'  relayPiiConfig: {rp if rp else "(none)"}')
              safe = cfg.get('safeFields') or []
              # ⚠⚠ 2026-08-27 — THIS LINE USED TO PROMISE "redactions should be
              # zero from here on", AND THAT PROMISE IS NOW DISPROVEN. The owner
              # saved `chunkBlocks` into Safe Fields, then sent four logs on
              # OTA-1520, and @password:filter still took ~344 chars four times
              # per bundle. Safe Fields excludes by FIELD NAME; the slice is an
              # ARRAY, so the scrubber works on chunkBlocks.0, .1, .2 … and the
              # exemption on the parent name does not follow it down. Say what is
              # SET, and let the SCRUB TOTALS above say what it achieved.
              print('  ⚠ chunkBlocks in safeFields: '
                    + ('YES (set — but measured NOT to stop @password:filter on '
                       'array elements; see SCRUB TOTALS)'
                       if any('chunkBlocks' in str(s) for s in safe)
                       else 'NO'))

          import urllib.parse
          for period in ('24h', '7d', '30d'):
              try:
                  q = urllib.parse.urlencode([
                      ('field', 'sum(quantity)'), ('statsPeriod', period),
                      ('groupBy', 'outcome'), ('groupBy', 'reason'),
                      # ⚠ interval must DIVIDE the period — passing interval==period
                      # 400s, which is how the first widened run came back empty
                      # for 7d and 30d and told us nothing.
                      ('groupBy', 'category'), ('interval', '1d'),
                  ])
                  stats = api(f'/organizations/{org}/stats_v2/?{q}')
                  print(f'── outcomes, last {period} (outcome / reason / category → count):')
                  rows = 0
                  for g in stats.get('groups', []):
                      by = g.get('by', {})
                      total = (g.get('totals', {}) or {}).get('sum(quantity)', 0)
                      if total:
                          rows += 1
                          print(f"  {by.get('outcome')} / {by.get('reason')} / {by.get('category')} → {total}")
                  if rows == 0:
                      print('  (nothing at all in this window)')
              except Exception as e:
                  print(f'outcomes query failed for {period}:', e)
          # ⚠⚠ AND THE QUOTA ITSELF — the second direction. If the attachment
          # category is capped or exhausted, that is the fact the SDK is
          # reacting to, and it is visible here rather than inferred from
          # silence.
          try:
              sub = api(f'/organizations/{org}/subscription/')
              print('── subscription / quota:')
              for k in ('planTier', 'plan', 'isFree', 'isTrial', 'canTrial'):
                  if k in sub:
                      print(f'  {k}: {sub[k]}')
              cats = sub.get('categories') or {}
              for name, c in (cats.items() if isinstance(cats, dict) else []):
                  if isinstance(c, dict):
                      print(f"  {name}: reserved={c.get('reserved')} used={c.get('usageExceeded') if 'usageExceeded' in c else ''} "
                            f"prepaid={c.get('prepaid')} usage={c.get('usage')}")
          except Exception as e:
              print('subscription query failed (token may lack billing scope):', e)

          # ⚠⚠⚠ 2026-08-27 — THE VERDICT BLOCK, LAST, SO IT IS ALWAYS IN THE TAIL.
          # Reading this run meant pulling hundreds of lines out of the middle of
          # a job log to find one number. Worse, the one question that mattered —
          # "are the missing parts absent from Sentry, or is this reader simply
          # not asking for them?" — could not be answered at all, because either
          # way a re-sync produces zero new files and looks identical.
          #
          # So the run now STATES it: how many pages were walked, how many rows
          # came back, and whether the walk ran out of cursor (complete) or hit
          # the cap (truncated). A reader that cannot distinguish "nothing there"
          # from "I stopped looking" is how the owner got told twice that his log
          # was somewhere it was not.
          # ⚠⚠⚠ AND "CURSOR EXHAUSTED" IS NOT "COMPLETE" — THIS BLOCK'S FIRST
          # RUN PROVED IT BY LYING. It printed:
          #
          #   1 page(s), 100 rows — COMPLETE — cursor exhausted
          #   ⚠ MISSING parts are therefore ABSENT FROM SENTRY
          #
          # Exactly 100 rows, one page, and no next cursor offered. But this tree
          # already holds 256 synced event directories, so Sentry plainly has more
          # than a hundred: the legacy /projects/…/events/ endpoint hands back the
          # most recent 100 and declines to paginate past them. An honest-looking
          # "no more pages" from a capped endpoint is indistinguishable from a
          # genuine end, and it produced exactly the wrong instruction — go make
          # another send to recover parts that may be sitting there already.
          #
          # ⚠⚠ SO A FULL FINAL PAGE IS TREATED AS SUSPECT, NOT AS PROOF. Only a
          # listing that ended SHORT of its page size has actually run out.
          PAGE_SIZE = 100
          suspect = [p for p, (_, rows, capped) in page_audit.items()
                     if capped or (rows and rows % PAGE_SIZE == 0)]
          V = []
          def say(line=''):
              V.append(line)
              print(line)
          say()
          say('════ VERDICT ════')
          if fetch_notes:
              say('  ⚠⚠ FETCH PROBLEMS THIS RUN — the deeper read may not have happened:')
              for n in fetch_notes:
                  say(f'    {n}')
          else:
              say('  every fetch this run succeeded')
          for path, (pages, rows, capped) in sorted(page_audit.items()):
              if capped:
                  state = 'TRUNCATED — page cap hit, more remain'
              elif rows and rows % PAGE_SIZE == 0:
                  state = (f'SUSPECT — ended on a full page of {PAGE_SIZE} with no next '
                           f'cursor; this endpoint caps rather than paginates')
              else:
                  state = 'COMPLETE — ended short of a full page'
              say(f'  {path}')
              say(f'    {pages} page(s), {rows} rows — {state}')
          if suspect:
              say('  ⚠⚠ AT LEAST ONE LISTING IS NOT PROVEN COMPLETE. Any MISSING parts'
                  ' below are UNPROVEN — they may simply be unread. DO NOT conclude'
                  ' the device failed, and DO NOT ask for another send on this basis.')
          else:
              say('  ⚠ Every listing ended short of a full page, so each genuinely ran'
                  ' out. MISSING parts are ABSENT FROM SENTRY — only a fresh send'
                  ' recovers them.')
          incomplete = [(bid, len(b['seen']), b['total'])
                        for bid, b in bundles.items() if len(b['seen']) < b['total']]
          if incomplete:
              say('  incomplete bundles:')
              for bid, have, total in sorted(incomplete):
                  say(f'    {bid}: {have}/{total} parts')
          else:
              say('  every bundle is complete')
          if scrubbed:
              say('  scrub cost per bundle:')
              for bid, notes in sorted(scrubbed.items()):
                  say(f'    {bid}: {len(notes)} redactions, {sum(l for _, _, l in notes)} chars')
          # ⚠⚠⚠ AND WRITE IT INTO THE TREE. Reading this verdict meant pulling it
          # out of the middle of a job log every single time — slow, and it burned
          # attention that belonged on the evidence. The relay commits sentry-inbox/
          # anyway; one more file costs nothing and means a `git pull` answers
          # "what did the last run actually find?" without touching the API.
          (out_root / 'VERDICT.txt').write_text(chr(10).join(V) + chr(10))
          PYEOF
      # ⚠⚠⚠ 2026-08-27 — REBASE BEFORE PUSHING, BECAUSE THE RELAY LOSES RACES.
      # This step used to `git push` bare, against a branch a session is actively
      # committing to. Run 31 fetched every event of the post-Safe-Fields send,
      # committed them, and then threw the whole run away:
      #
      #   ! [rejected]  golem-line -> golem-line (fetch first)
      #   error: failed to push some refs
      #
      # Run 29 died the same way. Nothing was corrupted — the next sync re-fetches
      # what never landed, because the skip test is "does event.json exist in the
      # tree" and a lost commit leaves it absent — but a red run is indistinguishable
      # at a glance from a token failure or an API outage, and this hunt has already
      # cost enough time to misread signals.
      #
      # ⚠⚠ REBASE, NOT MERGE, AND NOT FORCE. The relay only ever ADDS files under
      # sentry-inbox/; a session only ever touches request.txt and the workflow.
      # They cannot conflict, so replaying the sync commit on top of whatever
      # arrived is always the correct resolution. Force-pushing would discard the
      # session's work, which is the one outcome worth failing to avoid.
      - name: Commit the inbox
        run: |
          git config user.name 'sentry-inbox'
          git config user.email 'sentry-inbox@users.noreply.github.com'
          git add sentry-inbox/
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi
          git commit -m 'sentry-inbox: sync player-log bundles [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — rebasing onto the newer tip"
            git pull --rebase origin golem-line || {
              echo 'rebase failed; leaving the branch untouched for a human'
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo 'could not push after 5 attempts'
          exit 1
