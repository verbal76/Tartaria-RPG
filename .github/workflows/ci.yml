name: CI

# Quality gate for the JS/TS bundle — the thing that ships over-the-air to players.
# The repo had NINE build/keystore/cert workflows but ZERO that ran tsc/jest, so a
# whole class of regressions (and 201 test-fixture type errors) accumulated unseen.
# This adds the missing gate:
#   • typecheck (source)  — HARD BLOCK. app/ is strict-clean; any regression fails CI.
#   • typecheck (tests)   — RATCHET. the pre-existing test-fixture debt is frozen at a
#                            committed baseline; new/edited tests must typecheck (the
#                            count can only shrink, never grow).
#   • lint                — BLOCKING. ESLint 9 flat config (eslint.config.js), lean
#                            high-signal rule set the tree passes. Previously reported
#                            only because no flat config existed and the job errored.
#   • test (fast)         — jest, BLOCKING. The 467 deterministic unit/integration
#                            suites (~3950 tests) — the real regression ratchet. All
#                            green and stable: the 24 formerly-red suites were triaged
#                            (stale expectations, harness drift, a real fetch-courier
#                            gate bug), and a class of RNG flakes (an incidental-weather
#                            HP/stamina chip; a miscalibrated outcome-split band) was
#                            fixed at the source so this gate never flakes a merge.
#   • test (heavy sims)   — jest, REPORTED (non-blocking). The 27 stress / balance /
#                            long-run simulations (700-day sims, chaos sweeps, balance
#                            probes). These are an EXPLORATORY signal, not a per-PR
#                            blocker: the engine's world/persist layer grows super-
#                            linearly over a single very long run, so the heaviest sims
#                            are memory- and time-sensitive by nature. Gating every PR
#                            on that flagged-but-unfixed characteristic would be the
#                            wrong gate; they run serially with worker recycling and
#                            surface as a signal instead. (Tracking: the tail-growth
#                            finding is the thing to fix before these can block.)
# The source typecheck, the test-typecheck ratchet, AND the fast jest suite are the
# three REQUIRED gates; the heavy-sim job is reported.
#
# ⚠⚠⚠ 2026-09-10 — CI IS THE AUTHORITY, AND PUBLICATION DEPENDS ON IT. Owner:
# "Put the currently local-only gates under CI authority and make OTA
# publication dependent on successful validation. Avoid unnecessarily running
# the expensive fast surface twice."
#   • gates                — the fifteen `check:*` ratchets that until now ran only
#                            on a developer's machine (hunt stages, slice pins, verb
#                            reach, chevrons, standing-at, the OTA stamp, quoted pins,
#                            voice pools, guardian and mission claims, weapon names,
#                            the store ceiling, the kit palette and exports, the test
#                            split, the gold budget). Cheap, source-only, REQUIRED.
#   • publish              — runs ONLY on a push to the trunk, ONLY after every
#                            required job above is green, and ONLY when the push
#                            touched the JS bundle. It does not publish itself: it
#                            DISPATCHES eas-update-golem.yml for this exact commit
#                            and hands it this run's id as the validation receipt.
#                            The publisher then verifies that receipt against the
#                            API before it touches a channel. The fast surface runs
#                            once, here; the publisher never re-runs it.
#   • concurrency          — a newer push still cancels an in-flight run on any
#                            branch EXCEPT the trunk. On the trunk every push must
#                            finish, because an [ota-hal] publish and its golem
#                            catch-up land minutes apart and each one is owed its
#                            own validation and its own publish.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # ⚠ Never on the trunk — see the header. Two trunk pushes minutes apart are
  # two publishes, and cancelling the first would silently drop the one that
  # carried the marker.
  cancel-in-progress: ${{ github.ref != 'refs/heads/golem-line' }}

jobs:
  typecheck-source:
    name: typecheck (source · required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck shipped source (strict, must be clean)
        run: npm run typecheck:ci

  typecheck-tests:
    name: typecheck (tests · ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ratchet — test typecheck errors may not grow past the baseline
        run: npm run typecheck:tests

  lint:
    name: lint (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ESLint 9 flat config (eslint.config.js), lean high-signal rule set the
      # tree already passes. BLOCKING now that the config exists (it never ran
      # before — no flat config, so the job errored and was non-blocking).
      - name: Lint (blocking)
        run: npm run lint
      # HANDOFF prohibition ratchet. HANDOFF.md is a one-way write channel between
      # sessions with no review step, so a confident WRONG sentence propagates with
      # the same authority as a measured one. The dangerous shape is a prohibition
      # ("you cannot gate spin-offs locally") — a wrong instruction fails loudly the
      # first time someone follows it, a wrong prohibition fails silently forever
      # because nobody attempts the thing. This fails the build when a new one is
      # added without a receipt saying how and when it was established. Grandfathered
      # at a baseline; the debt can only ratchet DOWN.
      - name: HANDOFF claims ratchet (blocking)
        run: npm run check:handoff

      # Content reachability — authored content the player can never get to is the same
      # defect as content never written, and harder to notice. Data references only; see
      # PUNCHLIST.md for what this cannot see.
      - name: Content reachability (blocking)
        run: npm run check:reachability

      # ⚠⚠ OTA-1386 — THE FOUR PRODUCTS, CHECKED IN CI.
      #
      # This existed since OTA-1384 and only ever ran on a developer's machine,
      # which is the same as not existing. It renders all four configs through
      # Expo's own resolver and fails if any two share a name, package or
      # channel — a collision means one product's binary can be published to
      # another's channel, which is the worst thing one trunk can do.
      #
      # It is also the check that would have caught the package strip going
      # silently dead when app.config.js took over from app.json: the workflow
      # step kept succeeding, the file kept changing, and the RESOLVED config
      # stopped listening. Only a resolved-config check sees that.
      - name: Four product lines resolve distinctly (blocking)
        run: npm run check:lines

      # ⚠⚠ OTA-1415 — THE CHECK THAT WOULD HAVE SAVED TWENTY-ONE OTAs.
      #
      # Every gate was green from OTA-1394 to OTA-1414 and not one of them
      # shipped: the publish workflow ran on every push and FAILED on every
      # push, because eleven lazy `require()` calls in the freshly-carved slices
      # still pointed at gameStore's old directory. Metro was the only thing in
      # the pipeline that knew, and it knew in a log nobody opens.
      #
      # tsc does not resolve a require() string — several of these carried a
      # CORRECT type annotation beside a wrong path. eslint does not either;
      # they all sit under a no-require-imports disable. jest does not, because
      # they are cold paths no test walks.
      #
      # This is the cheapest stand-in for "Metro can bundle this" and it runs in
      # under a second. See the header of scripts/check-requires.mjs.
      - name: Relative require() specifiers all resolve (blocking)
        run: npm run check:requires

      # ⚠⚠⚠ OTA-1582 — THE ANSWER TO "THIS IS THE THIRD TIME YOU HAD TO DO THIS."
      # Three mission-text audits found three sets of the same class of defect,
      # because an audit is a snapshot and the data kept moving. This one holds:
      # a stage whose objective points at no tile, a post nobody authored, and —
      # the trap OTA-1582 itself created — a leading stage that names a person
      # and carries no verb, which a freshly-accepted record starts ON and which
      # nothing can ever advance. See scripts/check-mission-claims.mjs.
      - name: Mission data claims what the engine can deliver (blocking)
        run: npm run check:missionclaims

  gates:
    name: source gates (ratchets · required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ⚠⚠ Every `check:*` script in package.json runs here or in the lint job.
      # A ratchet that only runs by hand is a comment (OTA-1582's lesson, and
      # OTA-1386's before it). The suite ciPublicationDependsOnValidation holds
      # that no check:* script is left out of CI.
      - name: Hunt stages are reachable and well-formed (blocking)
        run: npm run check:huntstages
      - name: Fixed-window source pins may only shrink (blocking)
        run: npm run check:slicepins
      - name: Every verb is reachable or taught (blocking)
        run: npm run check:verbreach
      - name: Chevrons (blocking)
        run: npm run check:chevrons
      - name: Standing-at readers agree (blocking)
        run: npm run check:standingat
      - name: The OTA stamp matches the newest suite (blocking)
        run: npm run check:otastamp
      - name: Quoted source pins may only shrink (blocking)
        run: npm run check:quotedpins
      - name: Voice pools (blocking)
        run: npm run check:voicepools
      - name: Guardian data claims what the engine delivers (blocking)
        run: npm run check:guardianclaims
      - name: Weapon names resolve (blocking)
        run: npm run check:weaponnames
      - name: The store sits under its ceiling (blocking)
        run: npm run check:storeceiling
      - name: The kit palette is the palette (blocking)
        run: npm run check:kitpalette
      - name: The kit's export budget (blocking)
        run: npm run check:kitexports
      - name: The heavy/fast test split is a list, not a naming rule (blocking)
        run: npm run check:testsplit
      - name: The gold budget may only shrink (blocking)
        run: npm run check:gold

  test:
    name: jest (fast · required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      # The 1,188 deterministic unit/integration suites — the real regression
      # ratchet, and BLOCKING.
      #
      # ⚠⚠⚠ OTA-1726 — MEMBERSHIP COMES FROM A LIST NOW, NOT FROM FILENAMES. This
      # used to exclude by seven bare substrings (Stress/stressMode/Chaos/Probe/
      # Smoke/Sweep/Sim) matched against the path, so a suite opted OUT of the ship
      # gate by being NAMED. Two live OTA regression suites had been red and
      # unwatched for exactly that reason — both instrument failures, both
      # invisible, one for over two hundred OTAs. The set is
      # scripts/heavy-suites.mjs, every entry carries a reason, and
      # `check:testsplit` fails if it names a file that no longer exists or if
      # these scripts go back to splitting by name. Blocking is the DEFAULT.
      # After the RNG-flake fixes
      # (incidental-weather chip pinned to calm in jest.setup.js; miscalibrated
      # outcome-split band widened to ±5σ), it is
      # stable enough to block a merge. The old-space bump is headroom, not a
      # workaround — the fast suite is well inside it.
      - name: Run fast test suite (blocking)
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: npm run test:ci:fast -- --reporters=default

  test-heavy:
    name: jest (heavy sims · reported)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      # The 31 stress / balance / long-run simulations named in
      # scripts/heavy-suites.mjs. REPORTED, not blocking:
      # they exercise the engine's known super-linear world/persist tail-growth,
      # so the heaviest ones are memory- and time-sensitive by nature. They run
      # serially (--maxWorkers=1) with aggressive worker recycling
      # (--workerIdleMemoryLimit) so each mega-sim gets a near-fresh process and
      # they don't collectively OOM the runner. Extra old-space headroom for the
      # single biggest balance probe. This job's status is informational — the
      # tail-growth finding is tracked separately as the thing to fix before
      # these can become a required gate.
      - name: Run heavy simulation suite (reported)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run test:ci:heavy -- --reporters=default

  # ⚠⚠⚠ PUBLICATION DEPENDS ON VALIDATION — see the header. This job is the
  # ONLY automatic route to a player channel: it runs after every required job
  # is green, on the trunk, for a push that touched the bundle, and it hands
  # the publisher this run's id as the receipt the publisher must verify.
  publish:
    name: publish (dispatch the OTA for a validated trunk commit)
    runs-on: ubuntu-latest
    needs: [typecheck-source, typecheck-tests, lint, gates, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/golem-line'
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff the push range; a trunk push is one or two commits.
          fetch-depth: 50
      # ⚠ The bundle-path filter that used to be the publisher's own
      # `paths-ignore`. Native / build-config / tooling changes need a fresh
      # binary, not an OTA; a Sentry inbox sync must never republish; and a
      # test-only push ships nothing new to a phone (tests are not in the
      # bundle — the old filter published those, wastefully).
      - name: Did this push touch the JS bundle?
        id: bundle
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="${AFTER}^..${AFTER}"
          else
            RANGE="${BEFORE}..${AFTER}"
          fi
          TOUCHED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              sentry-inbox/*|package.json|package-lock.json|app.json|app.config.js|eas.json|metro.config.js|babel.config.js|tsconfig.json|.github/*|*.md|docs/*|scripts/*|android/*|ios/*|desktop/*|web-stubs/*|__tests__/*|test-utils/*|jest.setup.js|jest.config.js|scratchpad/*) ;;
              *) echo "bundle path changed: $f"; TOUCHED=1 ;;
            esac
          done < <(git diff --name-only "$RANGE")
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
          [ "$TOUCHED" = "1" ] || echo "::notice::No JS-bundle path changed in $RANGE — nothing to publish."
      - name: Dispatch the publisher for this validated commit
        if: steps.bundle.outputs.touched == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⚠ `line` is advisory here: an automatic run re-derives the line from
          # the commit TITLE inside the publisher ([ota-hal] → hal, else golem),
          # so nothing unattended reaches a player — the same firewall as before,
          # now behind validation. `validated_by` is the receipt it checks.
          gh workflow run eas-update-golem.yml --ref golem-line \
            -f sha="${{ github.sha }}" \
            -f validated_by="${{ github.run_id }}" \
            -f line=golem
          echo "Dispatched eas-update-golem.yml for ${{ github.sha }} (validated by run ${{ github.run_id }})."
