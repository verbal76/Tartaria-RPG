name: Build Android APK

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - preview
          - development
          - production

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (local)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK on this runner
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIA }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          PROFILE="${{ github.event.inputs.profile || 'apk' }}"
          echo "Building profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output ./tartaria-${{ github.run_number }}.apk

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT_MSG="${{ github.event.head_commit.message || github.event_name }}"
          APK=$(find . -maxdepth 1 -name "*.apk" -o -name "*.aab" | head -1)

          gh release create "$TAG" \
            "$APK" \
            --repo "${{ github.repository }}" \
            --title "Tartaria APK — Build #${{ github.run_number }}" \
            --notes "**Branch:** \`${BRANCH}\`
**Commit:** ${COMMIT_MSG}
**Build #:** ${{ github.run_number }}

Install the attached APK on your Android device. Enable *Install unknown apps* for your browser or file manager if prompted." \
            --prerelease
