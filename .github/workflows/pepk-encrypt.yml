name: Setup · Play signing key (PEPK)

# Produces the encrypted ZIP that Play Console's
# "Export and upload a key from Java keystore" flow requires.
#
# Inputs (all already in the repo / secrets):
#   - Keystore           : ANDROID_KEYSTORE_BASE64 secret
#   - Keystore password  : ANDROID_KEYSTORE_PASSWORD secret
#   - Key password       : ANDROID_KEY_PASSWORD secret
#   - Key alias          : ANDROID_KEY_ALIAS secret
#   - PEPK tool          : ci/play-app-signing/pepk.jar
#   - Play encryption PK : ci/play-app-signing/encryption_public_key.pem
#
# Output: workflow artifact "encrypted-upload-key" containing
#         encrypted_upload_key.zip — upload this in Play Console
#         under "Upload generated ZIP" on the app signing preferences
#         page (Test and release > Setup > App integrity, then change
#         signing key > Export and upload a key from Java keystore).
#
# Trigger: push to this file (edit a comment + commit to re-run) or
#          manual workflow_dispatch from the Actions tab.

on:
  push:
    paths:
      - '.github/workflows/pepk-encrypt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sanity — required files present
        run: |
          set -euo pipefail
          for f in ci/play-app-signing/pepk.jar ci/play-app-signing/encryption_public_key.pem; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > tartaria-upload.jks
          echo "Keystore decoded: $(stat -c%s tartaria-upload.jks) bytes"

      - name: Verify keystore unlocks with stored password + alias exists
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore tartaria-upload.jks \
              -storepass:env ANDROID_KEYSTORE_PASSWORD > /tmp/keylist.txt 2>&1; then
            echo "::error::Keystore did not unlock. ANDROID_KEYSTORE_PASSWORD may be wrong."
            cat /tmp/keylist.txt || true
            exit 1
          fi
          if ! grep -q "$ANDROID_KEY_ALIAS" /tmp/keylist.txt; then
            echo "::error::Alias '$ANDROID_KEY_ALIAS' not found in keystore."
            echo "--- keystore listing ---"
            cat /tmp/keylist.txt
            exit 1
          fi
          echo "ok: keystore unlocks, alias '$ANDROID_KEY_ALIAS' present"

      - name: Install expect (drive PEPK's TTY-only password prompts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

      - name: Run PEPK — produce encrypted upload-key ZIP
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # PEPK calls java.io.Console.readPassword() which returns null
          # without a controlling TTY (CI runner case → NPE). Drive it via
          # expect so the prompts get a real pseudo-tty.
          cat > /tmp/run-pepk.expect <<'EXPECT_SCRIPT'
          #!/usr/bin/expect -f
          set timeout 120
          set keystore_pass $env(ANDROID_KEYSTORE_PASSWORD)
          set key_pass $env(ANDROID_KEY_PASSWORD)
          set key_alias $env(ANDROID_KEY_ALIAS)

          # Log everything PEPK prints so a prompt-pattern miss is diagnosable.
          log_user 1

          spawn java -jar ci/play-app-signing/pepk.jar \
            --keystore=tartaria-upload.jks \
            --alias=$key_alias \
            --output=encrypted_upload_key.zip \
            --include-cert \
            --rsa-aes-encryption \
            --encryption-key-path=ci/play-app-signing/encryption_public_key.pem

          # Two password prompts in order: store, then key.
          # Broad "ass" regex tolerates variants like
          #   "Password for the store containing private key:"
          #   "Password for the key:"
          # without committing to exact wording.
          expect {
            -re "(?i)pass" { send -- "$keystore_pass\r" }
            timeout { puts stderr "::error::Timed out waiting for keystore password prompt."; exit 2 }
            eof { puts stderr "::error::PEPK exited before keystore password prompt."; exit 3 }
          }
          expect {
            -re "(?i)pass" { send -- "$key_pass\r" }
            timeout { puts stderr "::error::Timed out waiting for key password prompt."; exit 4 }
            eof { puts stderr "::error::PEPK exited before key password prompt."; exit 5 }
          }
          expect eof
          catch wait result
          set status [lindex $result 3]
          exit $status
          EXPECT_SCRIPT

          chmod +x /tmp/run-pepk.expect
          /tmp/run-pepk.expect

          ls -lh encrypted_upload_key.zip
          echo "::notice::ZIP produced. Download the 'encrypted-upload-key' artifact from this run, then upload it in Play Console under 'Upload generated ZIP'."

      - name: Upload encrypted ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-upload-key
          path: encrypted_upload_key.zip
          retention-days: 30
