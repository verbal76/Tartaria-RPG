name: iOS Build (native, GitHub Actions macOS fallback)

# STUB on main — the real workflow lives on HaL2001 (where the code is).
# This file exists only to make the workflow visible in the Actions UI's
# "Run workflow" dropdown (workflow_dispatch surfaces only workflows on
# the default branch). When the user picks HaL2001 from the "Use workflow
# from" dropdown, GitHub loads the workflow file from HaL2001 — this stub
# is never executed in that case.
#
# This stub only runs if someone accidentally fires the workflow against
# main itself (the dropdown defaults to main and is easy to miss). It
# exits cleanly with a loud error message rather than burning ~25 macOS
# quota minutes on a doomed run (main has no code, no lockfile, no
# native iOS bits).

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit .ipa to TestFlight after build (requires APPLE_APP_SPECIFIC_PASSWORD secret)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  refuse:
    name: Refuse to run against main — re-dispatch against HaL2001
    runs-on: ubuntu-latest
    steps:
      - name: Loud refusal
        run: |
          echo "::error::This workflow was fired against the 'main' branch, which has no code — just the pointer doc."
          echo "::error::Re-dispatch with 'Use workflow from: HaL2001' selected in the Run workflow dropdown."
          echo "::error::See HANDOFF.md OTA-265 / 266 for context."
          exit 1
