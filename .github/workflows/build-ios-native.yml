name: Build · iOS (macOS runner)

# Backup iOS build path for when EAS Build is down. Runs the entire
# build on GitHub's `macos-14` runner using xcodebuild directly —
# zero dependency on Expo's infrastructure. Same .ipa output as the
# EAS path; signed with the same Distribution Certificate (exported
# from EAS once, stored in GitHub Secrets).
#
# WHY THIS EXISTS (OTA-265 / 2026-05-31 EAS outage):
#   EAS's macOS data center had a multi-hour networking outage
#   blocking every iOS build for ~hours-plus. The primary build path
#   (.github/workflows/build-ios.yml) wraps eas-cli build, which
#   queues the work on EAS's macOS workers — when those workers
#   are unreachable, our pipeline is dead even though GitHub Actions
#   itself is up. This workflow IS the fallback: macOS runner on
#   GitHub's side, no EAS dependency, direct xcodebuild output.
#
# REQUIRED GITHUB SECRETS (one-time setup; see HANDOFF.md for the
# walkthrough):
#   IOS_DIST_CERT_P12_BASE64        — .p12 export of Distribution
#                                      Certificate, base64-encoded.
#   IOS_PROVISIONING_PROFILE_BASE64 — .mobileprovision file,
#                                      base64-encoded.
#   APPLE_ID                        — already set; used for submit.
#   APPLE_APP_SPECIFIC_PASSWORD     — already set; used for submit
#                                      via xcrun altool.
#   ASC_APP_ID, APPLE_TEAM_ID       — already set; not strictly
#                                      required here but useful.
#
# OPTIONAL secret:
#   IOS_DIST_CERT_P12_PASSWORD      — only if EAS asked for one
#                                      during the .p12 download.
#                                      EAS often hands out .p12 files
#                                      with no password (empty), in
#                                      which case skip this secret
#                                      entirely — the workflow falls
#                                      back to empty.
#
# COST: this workflow runs on `macos-14` which counts 10× against
# the GitHub Actions minute quota (private repos: Free = 2000 min/mo
# = ~8 macOS builds; Pro = 3000 = ~12). Reserved for fallback use,
# not every commit. Triggered manually via workflow_dispatch OR by a
# commit whose FIRST LINE starts with [build-ios-native].
#
# TRIGGER PATHS:
#   - workflow_dispatch (Actions UI → Run workflow); the only way
#     you fire this when EAS is down on a calm day.
#   - commit FIRST LINE starts with [build-ios-native] — useful for
#     scripted recovery during long outages.
#
# DOES NOT auto-fire on regular pushes (paths-ignore: ['**']). Quota
# is precious; macOS minutes don't get spent on every code change.

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
      - 'HaL2001'
    # Skip every path-driven push so this never auto-fires; the
    # commit-message check below is what gates intentional runs.
    paths-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit .ipa to TestFlight after build (requires APPLE_APP_SPECIFIC_PASSWORD secret)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build iOS .ipa on GitHub macOS runner
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determine whether to actually run (commit marker check) and
      # whether to also submit to TestFlight. workflow_dispatch
      # bypasses the marker check and uses the input directly.
      - name: Determine run + submit flags
        id: meta
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_RUN="true"
            SHOULD_SUBMIT="${{ github.event.inputs.submit || 'false' }}"
          elif [[ "$FIRST_LINE" =~ ^\[build-ios-native\] ]]; then
            SHOULD_RUN="true"
            if [[ "$FIRST_LINE" =~ \[submit-ios\] ]]; then
              SHOULD_SUBMIT="true"
            else
              SHOULD_SUBMIT="false"
            fi
          else
            SHOULD_RUN="false"
            SHOULD_SUBMIT="false"
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "submit=$SHOULD_SUBMIT" >> "$GITHUB_OUTPUT"
          echo "Will run: $SHOULD_RUN, Will submit: $SHOULD_SUBMIT"

      - name: Exit if not triggered
        if: steps.meta.outputs.should_run != 'true'
        run: |
          echo "Commit lacks [build-ios-native] marker and this isn't a workflow_dispatch — exiting cleanly."
          exit 0

      - name: Setup Node
        if: steps.meta.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Xcode 26 (latest available)
        if: steps.meta.outputs.should_run == 'true'
        run: |
          # Apple's 2026-04-28 deadline requires Xcode 26 / iOS 26 SDK
          # for all App Store Connect uploads. macos-15 runners have
          # Xcode 26.x preinstalled; macos-14 only had up to 15.4 which
          # also caused a downstream C++20 compile error in
          # react-native-executorch (VoiceActivityDetection.cpp:145
          # uses aggregate-emplace which clang 15 + C++17 rejects).
          #
          # The first attempt (build #1) silently fell back to the
          # default `Xcode.app` symlink (15.4) because Xcode_26.app
          # wasn't installed on macos-14. To avoid that silent fall-
          # back, list every Xcode under /Applications and PICK THE
          # HIGHEST. Fail loudly if none of them is >= Xcode 26.
          echo "==== Available Xcode installs ===="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found at /Applications/Xcode*.app)"
          # Pick the highest-versioned Xcode in /Applications. Sort
          # version-aware so "26.2" > "16.x" > "15.x". Bash's `sort
          # -V` is version-sort.
          PICK=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null \
            | awk -F'/Applications/Xcode_?' '{print $NF}' \
            | sed 's/\.app$//' \
            | sort -V \
            | tail -1)
          if [ -z "$PICK" ]; then
            echo "::error::No Xcode found under /Applications. Runner image may be broken."
            exit 1
          fi
          # Reconstruct the .app path. PICK is either "" (means the
          # bare Xcode.app symlink), or a version string like "26.2".
          if [ "$PICK" = "Xcode" ]; then
            APP_PATH="/Applications/Xcode.app"
          else
            APP_PATH="/Applications/Xcode_${PICK}.app"
            # Fall back to the plain Xcode.app if our version-suffixed
            # guess doesn't exist (the directory naming convention can
            # surprise us).
            [ -d "$APP_PATH" ] || APP_PATH="/Applications/Xcode.app"
          fi
          echo "Selected: $APP_PATH"
          sudo xcode-select -s "$APP_PATH/Contents/Developer"
          xcodebuild -version
          # Hard-gate on Xcode 26.x — if the runner only has 15/16
          # we'll silently produce an .ipa Apple will reject at the
          # submit step, OR fail noisily in the C++20 compile step.
          # Fail here instead so the failure is one step earlier and
          # legible.
          XCODE_MAJOR=$(xcodebuild -version | head -1 | sed 's/^Xcode //' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Selected Xcode is $XCODE_MAJOR.x; need >= 26 for Apple submission AND for react-native-executorch's C++20 reqs."
            echo "::error::macos-15 runner should have Xcode 26 preinstalled. If GitHub hasn't shipped it yet, switch runs-on to macos-latest or a newer label."
            exit 1
          fi
          echo "✓ Xcode $XCODE_MAJOR.x selected."

      - name: Install dependencies
        if: steps.meta.outputs.should_run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Strip .hal2001 suffix from bundle id (production-only build)
        if: steps.meta.outputs.should_run == 'true'
        run: |
          # Same strip the EAS build-ios.yml does — production builds
          # use the bare bundle id `com.hotatticgames.tartarprim` to
          # match the App Store Connect listing.
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const before = app.expo?.ios?.bundleIdentifier;
            if (app.expo?.ios?.bundleIdentifier?.endsWith('.hal2001')) {
              app.expo.ios.bundleIdentifier = app.expo.ios.bundleIdentifier.slice(0, -'.hal2001'.length);
            }
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('iOS bundle id:', before, '->', app.expo.ios.bundleIdentifier);
          "

      - name: Verify required GitHub Secrets are present
        if: steps.meta.outputs.should_run == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          MISSING=""
          [ -z "${IOS_DIST_CERT_P12_BASE64:-}" ] && MISSING="$MISSING IOS_DIST_CERT_P12_BASE64"
          [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ] && MISSING="$MISSING IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub Secret(s):$MISSING"
            echo "::error::See HANDOFF.md OTA-265 walkthrough — export cert + profile from expo.dev → Credentials → iOS."
            exit 1
          fi
          echo "✓ Required secrets present (IOS_DIST_CERT_P12_PASSWORD is optional; empty default is fine for EAS .p12 exports without a set password)."

      - name: Import signing certificate into temporary keychain
        if: steps.meta.outputs.should_run == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Materialize the .p12 from the base64 secret.
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Create a transient build keychain (deleted at runner
          # teardown — secret never persists past the run).
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import the .p12. -T grants codesign access to the key
          # without an interactive Allow prompt.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Sanity-check the cert is visible.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: steps.meta.outputs.should_run == 'true'
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/app.mobileprovision"
          # Parse the UUID + name out of the profile so the export
          # step below can reference them deterministically.
          PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" | plutil -extract Name raw -)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile installed: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Generate native iOS project (expo prebuild)
        if: steps.meta.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          # Skip --install so we control the pod install step
          # explicitly below (lets us cache pods cleanly in a
          # future iteration).
          npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        if: steps.meta.outputs.should_run == 'true'
        run: |
          cd ios
          pod install --repo-update

      - name: Write ExportOptions.plist
        if: steps.meta.outputs.should_run == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # app-store-connect == TestFlight + App Store distribution.
          # signingStyle=manual + the explicit profile dict tells
          # xcodebuild to use the .mobileprovision we just installed.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hotatticgames.tartarprim</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive (xcodebuild)
        if: steps.meta.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          # The scheme + workspace name come from expo prebuild's
          # default — it joins app.json's `name` ("Tartaria Realms
          # HAL") with spaces stripped → "TartariaRealmsHAL".
          xcodebuild \
            -workspace ios/TartariaRealmsHAL.xcworkspace \
            -scheme TartariaRealmsHAL \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TartariaRealmsHAL.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            archive

      - name: Export .ipa
        if: steps.meta.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/TartariaRealmsHAL.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Upload .ipa as artifact (backup, always)
        if: steps.meta.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TartariaRealmsHAL-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload to App Store Connect / TestFlight (gated)
        if: steps.meta.outputs.should_run == 'true' && steps.meta.outputs.submit == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "::warning::APPLE_APP_SPECIFIC_PASSWORD not set — .ipa is in the artifact above; submit manually via Transporter or eas submit."
            exit 0
          fi
          IPA_FILE=$(ls "$RUNNER_TEMP/ipa/"*.ipa | head -1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          echo "✓ Upload complete — watch App Store Connect for processing."

      - name: Clean up keychain
        if: always() && steps.meta.outputs.should_run == 'true'
        run: |
          # Defensive cleanup — runner is ephemeral and torn down
          # anyway, but explicit deletion documents intent.
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
