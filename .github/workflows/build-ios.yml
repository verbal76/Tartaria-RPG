name: iOS Build (Tartaria Realms)

# OTA-302 submit pass — rebuild + AUTO-SUBMIT to TestFlight. The earlier
# [build-ios] run built the IPA but with submit:false, and the manual
# submit-ios.yml dispatch wasn't permitted from automation, so nothing
# reached TestFlight. This commit leads with [build-ios] [submit-ios] so the
# production build runs with eas build --auto-submit (lands in App Store
# Connect / TestFlight when the build finishes).
#
# OTA-302 (Ember Anvil) — trigger-touch for the production iOS IPA of the
# arbiters-line working build (arb70) promoted onto the HaL2001 conduit.
# build-ios's paths-ignore skips app/**, so this non-ignored edit fires the
# [build-ios] production build. See HANDOFF.md → OTA-302.
#
# OTA-302 re-trigger: the combined "[build-aab] [build-ios] …" commit led with
# [build-aab], so this workflow's STRICT first-line-prefix check resolved to
# `preview` (internal dist, no creds) and failed. Re-firing with [build-ios] as
# the leading token so the production (App Store) profile is selected.
#
# Triggers EAS Build for iOS — Expo's hosted macOS infrastructure does
# the cert/provisioning/Xcode work. We just hand it the project,
# auth, and Apple credentials; it returns a signed .ipa.
#
# Retry note (2026-05-31): EAS occasionally errors at the "Prepare
# project" phase with a network timeout downloading the project archive
# from its own CDN — transient infra hiccup, not a config issue. To
# retry, push a commit whose first line starts with [build-ios] AND
# touches a non-paths-ignored file (an empty commit will NOT trigger
# because GitHub Actions' paths-ignore skips workflows when zero files
# changed). This file (build-ios.yml) is itself not in the ignore list,
# so touching its header is the canonical retry mechanism.
#
# Required GitHub Secrets (configure once at repo settings):
#   EXPO_TOKEN          — from expo.dev → Account → Access Tokens
#   APPLE_ID            — your Apple Developer email
#   APPLE_APP_SPECIFIC_PASSWORD — appleid.apple.com → Sign-In and Security
#                         → App-Specific Passwords → generate one
#                         (or use APPLE_TEAM_ID + ASC_API_KEY for
#                         long-term automation)
#   ASC_APP_ID          — App Store Connect app's numeric ID (after
#                         you create the listing; needed for submit)
#   APPLE_TEAM_ID       — your 10-char developer team ID
#
# Trigger paths:
#   - commit message contains [build-ios] → production iOS build
#   - tag v*-ios → production iOS build
#   - workflow_dispatch with profile=production → production
#   - workflow_dispatch with profile=preview → unsigned-distribution
#     internal build for sideload testing
#
# What it does:
#   1. Strip the .hal2001 suffix from ios.bundleIdentifier when
#      building production (same Play-Console-vs-HaL logic as the
#      Android workflow). Preview builds keep the suffix.
#   2. Run `eas-cli build --platform ios --profile <profile>
#      --non-interactive` — EAS handles cert + provisioning,
#      builds on its macOS infra, uploads to Expo's CDN.
#   3. Optionally `eas-cli submit --platform ios --latest
#      --non-interactive` to ship the latest production build
#      to TestFlight (skipped for preview builds and unless
#      [submit-ios] is also in the commit message).

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
      # ⚠ OTA-1386 — 'HaL2001' REMOVED, archived by the branch collapse. The
      # trunk builds HAL now, selected by the `line` input below.
    tags:
      - 'v*-ios'
    paths-ignore:
      - 'app/**'
      - 'App.tsx'
      - 'assets/**'
      - 'docs/**'
      - 'scripts/**'
      - '__tests__/**'
      - '**.md'
      # Don't fire iOS build for Android-only workflow changes.
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview = sideload, production = TestFlight-ready)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      submit:
        description: 'Submit to TestFlight after build (production only)'
        required: false
        default: false
        type: boolean
      # ⚠⚠ OTA-1386 — see build-apk.yml for the full note. The branch used to
      # answer "which product"; the collapse removed that answer, this restores it.
      line:
        description: 'Product line (golem = dev phone, hal = live testers, steam = PC, html = web)'
        required: false
        default: 'golem'
        type: choice
        options:
          - golem
          - hal
          - steam
          - html

permissions:
  contents: write

jobs:
  build:
    name: Build Tartaria Realms iOS via EAS
    runs-on: ubuntu-latest
    env:
      # Job-wide so every Expo invocation agrees. A push carries no input and
      # falls to golem — the dev line, never someone else's shipping product.
      TARTARIA_LINE: ${{ github.event.inputs.line || 'golem' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ⚠⚠ OTA-1182 — THE PREVIEW PROFILE HAS NEVER BEEN ABLE TO BUILD, AND IT IS THE
      # DEFAULT. `preview` is `distribution: internal` (eas.json), which needs ad-hoc
      # provisioning credentials this project does not hold — see the notes at the bottom
      # of this file recording the same failure twice already (arb172, OTA-302: "the
      # preview profile (no internal-distribution creds) failed").
      #
      # ⚠ So EVERY ordinary push that reaches this workflow ends in a red iOS X for a
      # reason that has nothing to do with iOS. Two consequences, and the second is the
      # dangerous one:
      #   1. It trained me to read the failure as expected noise — I reported it to the
      #      owner on 2026-08-09 as "pre-existing, not from these changes", which was true
      #      and also exactly what someone would say about a real regression.
      #   2. A GENUINE iOS build failure would look identical. The signal is unusable.
      #
      # This skips cleanly instead of failing. A red iOS check now means something.
      # ⚠ NOTHING ABOUT CREDENTIALS IS TOUCHED — this only stops attempting a build that
      # cannot succeed. To make a real (TestFlight-ready) IPA, lead the commit title with
      # [build-ios], push a v*-ios tag, or dispatch with profile=production.
      - name: Determine build profile
        id: meta
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Resolution chain:
          #   1. tag v*-ios → production (TestFlight-ready)
          #   2. commit message FIRST LINE STARTS WITH [build-ios] →
          #      production. Strict prefix match so commits like
          #      "Fix iOS workflow false-positive on [build-ios] in
          #      body" don't false-positive production. To intentionally
          #      fire production iOS, title the commit:
          #        [build-ios] OTA-XXX — description
          #        or to also auto-submit to TestFlight:
          #        [build-ios] [submit-ios] OTA-XXX — description
          #   3. workflow_dispatch input → as chosen
          #   4. default → preview (sideload internal build)
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/v*-ios ]]; then
            PROFILE="production"
            SHOULD_SUBMIT="true"
          elif [[ "$FIRST_LINE" =~ ^\[build-ios\] ]]; then
            PROFILE="production"
            # [submit-ios] gates the auto-submit step. Must also be
            # in the first line (anywhere after [build-ios]).
            if [[ "$FIRST_LINE" =~ \[submit-ios\] ]]; then
              SHOULD_SUBMIT="true"
            else
              SHOULD_SUBMIT="false"
            fi
          else
            PROFILE="${{ github.event.inputs.profile || 'preview' }}"
            SHOULD_SUBMIT="${{ github.event.inputs.submit || 'false' }}"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "submit=$SHOULD_SUBMIT" >> "$GITHUB_OUTPUT"
          echo "Building Tartaria Realms iOS — line: $TARTARIA_LINE, profile: $PROFILE, submit: $SHOULD_SUBMIT"

      # ⚠⚠ OTA-1386 — THE STORE BUNDLE ID, AND WHY THIS STEP SHRANK.
      # Production iOS builds use the bare bundle identifier to match the App
      # Store Connect listing; preview/sideload builds keep the line's suffix so
      # test installs stay a separate app. That is unchanged.
      # What changed: this step used to rewrite app.json, and since OTA-1384
      # app.config.js overrides `ios.bundleIdentifier` afterwards — so the rewrite
      # stopped reaching the build while still printing a convincing before/after.
      # The flip now lives in app.config.js, and this only asks for it.
      # Same silent break as build-apk.yml; see the longer note there.
      - name: Select the store bundle id for a production iOS build
        if: steps.meta.outputs.profile == 'production'
        run: |
          echo "TARTARIA_STORE_BUILD=1" >> "$GITHUB_ENV"
          echo "Production iOS — bundle id will resolve to the bare store id."

      - name: Stamp unique iOS buildNumber = GitHub run_number
        run: |
          # eas.json uses appVersionSource:"local" + autoIncrement, which
          # RESETS the iOS buildNumber every CI run and bumps 1 -> 2 each time,
          # so every build comes out as 2.4.1 (2) — identical to the build
          # already in TestFlight. Apple rejects a duplicate version+build, so
          # the auto-submit silently fails ("fresh build, nothing in TestFlight").
          # Stamp a unique, monotonically-increasing buildNumber from the GitHub
          # run_number (mirrors the Android versionCode inject) so each build is
          # strictly higher than the last and App Store Connect accepts it.
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.ios = app.expo.ios || {};
            app.expo.ios.buildNumber = String(${{ github.run_number }});
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('iOS buildNumber stamped =', app.expo.ios.buildNumber);
          "

      # ⚠⚠ OTA-1386 — THE ONE PLACE A JOB-LEVEL ENV VAR IS NOT ENOUGH.
      #
      # build-apk.yml and build-ios-native.yml compile ON THIS RUNNER, so the job's
      # TARTARIA_LINE is in scope when Expo evaluates app.config.js. `eas build`
      # does not: it uploads the project and runs `expo prebuild` on an EAS worker,
      # in a fresh environment that has never heard of this workflow's env block.
      # An unset var there resolves to golem — so dispatching line=hal would have
      # queued a build wearing golem's name, id and channel, and the run would have
      # gone green.
      #
      # eas.json travels WITH the project, and EAS applies `build.<profile>.env` to
      # the worker. Writing it here is the only channel this value has into that
      # environment. The file is edited on the runner only — never committed.
      - name: Carry TARTARIA_LINE into the EAS worker (via eas.json profile env)
        if: steps.meta.outputs.profile == 'production'
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            const p = '${{ steps.meta.outputs.profile }}';
            if (!j.build || !j.build[p]) {
              console.error('::error::eas.json has no build profile ' + p);
              process.exit(1);
            }
            j.build[p].env = { ...(j.build[p].env || {}), TARTARIA_LINE: process.env.TARTARIA_LINE };
            if (process.env.TARTARIA_STORE_BUILD === '1') j.build[p].env.TARTARIA_STORE_BUILD = '1';
            fs.writeFileSync('eas.json', JSON.stringify(j, null, 2));
            console.log('eas.json build.' + p + '.env =', JSON.stringify(j.build[p].env));
          "

      - name: Show the resolved identity actually being built
        run: |
          # ⚠ Read it back through EXPO'S resolver rather than from a file. The
          # package strip broke unnoticed precisely because the file on disk and
          # the resolved config had stopped agreeing.
          npx expo config --type public --json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);console.log('line:      '+(c.extra&&c.extra.tartariaLine));console.log('name:      '+c.name);console.log('bundle id: '+(c.ios&&c.ios.bundleIdentifier));console.log('channel:   '+(c.updates&&c.updates.requestHeaders&&c.updates.requestHeaders['expo-channel-name']));console.log('sharing:   '+(c.extra&&c.extra.fallenSharing));})"

      - name: Verify EXPO_TOKEN secret is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is missing."
            echo "::error::Add it at GitHub repo Settings → Secrets and variables → Actions."
            echo "::error::Generate the token at https://expo.dev/accounts/<account>/settings/access-tokens"
            exit 1
          fi
          echo "✓ EXPO_TOKEN is set."

      - name: Skip — preview profile has no internal-distribution credentials
        if: steps.meta.outputs.profile != 'production'
        run: |
          echo "::notice::iOS build SKIPPED — profile '${{ steps.meta.outputs.profile }}'"
          echo ""
          echo "The 'preview' profile is distribution:internal and needs ad-hoc"
          echo "provisioning credentials this project does not hold, so it has never"
          echo "produced a build. Skipping rather than failing, so that a RED iOS check"
          echo "means a real problem."
          echo ""
          echo "To build a TestFlight-ready IPA, do ONE of:"
          echo "  * title the commit:  [build-ios] OTA-XXX — description"
          echo "    (add [submit-ios] too, to auto-submit to TestFlight)"
          echo "  * push a tag matching v*-ios"
          echo "  * run this workflow manually with profile=production"

      - name: EAS Build (iOS, non-interactive) — with optional auto-submit
        if: steps.meta.outputs.profile == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Auth + credentials state (as of 2026-05-31):
          # - Distribution Certificate + Provisioning Profile live on
          #   EAS (created via `eas credentials --platform ios`), so
          #   the build reuses them automatically.
          # - eas.json submit.production.ios hardcodes appleId /
          #   ascAppId / appleTeamId directly (NOT $VAR placeholders —
          #   EAS does NOT substitute env vars into those fields, that
          #   was a wrong assumption that broke --auto-submit until the
          #   placeholders were replaced with literal values).
          # - The App Store Connect API Key (ID WJ44NUUU49, APP_MANAGER
          #   role) is stored on EAS servers from the first manual
          #   submission, so the post-build --auto-submit task uses
          #   that key for App Store Connect authentication — no
          #   password / 2FA needed.
          # - EXPO_APPLE_* env vars below are a fallback auth mode in
          #   case EAS ever falls back off the stored API key. Safe to
          #   keep; ignored when the API key is available.
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Profile: ${{ steps.meta.outputs.profile }}, submit: ${{ steps.meta.outputs.submit }}"
          # --no-wait returns the moment the build is queued on Expo's
          # macOS workers (no idle GitHub minutes burning during the
          # 20-30 min Xcode work). Build status:
          # https://expo.dev/accounts/hot-attic-games/projects/tartaria-/builds
          #
          # --auto-submit (added when [submit-ios] was in the commit, or
          # for tag/dispatch submits) tells EAS to submit the .ipa to
          # TestFlight automatically AFTER the build finishes, server-side.
          # This is the reliable path: a separate `eas submit --latest`
          # step would race the --no-wait build and find no finished
          # build to submit (fatal for the very first build, where no
          # prior successful build exists).
          AUTOSUBMIT=""
          if [ "${{ steps.meta.outputs.submit }}" = "true" ]; then
            AUTOSUBMIT="--auto-submit"
            echo "Auto-submit ENABLED — EAS will push to TestFlight after the build completes."
          fi
          npx eas-cli build \
            --platform ios \
            --profile "${{ steps.meta.outputs.profile }}" \
            --non-interactive \
            --no-wait \
            $AUTOSUBMIT

# arb172 trigger-touch — re-fire the production (TestFlight) IPA with [build-ios]
# LEADING the commit first line. The prior trailing-marker commit selected the
# preview profile (no internal-distribution creds) and failed; OTA-302 same fix.

# arb172 re-trigger #2 — [build-ios] MUST be the first token (^\[build-ios\]);
# the prior "[build-aab] [build-ios]" title started with [build-aab] so the iOS
# regex anchor missed and it fell to preview. Title now leads with [build-ios].
