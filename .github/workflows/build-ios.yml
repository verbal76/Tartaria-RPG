name: iOS Build (Tartaria Realms)

# Triggers EAS Build for iOS — Expo's hosted macOS infrastructure does
# the cert/provisioning/Xcode work. We just hand it the project,
# auth, and Apple credentials; it returns a signed .ipa.
#
# Required GitHub Secrets (configure once at repo settings):
#   EXPO_TOKEN          — from expo.dev → Account → Access Tokens
#   ASC_API_KEY_P8      — the full CONTENTS of the .p8 App Store Connect
#                         API key (App Store Connect → Users and Access
#                         → Integrations → App Store Connect API → +).
#                         This is the cloud-only auth that lets EAS
#                         GENERATE the Distribution Certificate +
#                         Provisioning Profile non-interactively — no
#                         laptop / interactive `eas credentials` needed.
#   ASC_KEY_ID          — the Key ID shown next to the key (10 chars)
#   ASC_ISSUER_ID       — the Issuer ID at the top of the Keys page (UUID)
#   ASC_APP_ID          — App Store Connect app's numeric ID (in the app
#                         URL: /apps/<ASC_APP_ID>/...; needed for submit)
#   APPLE_TEAM_ID       — your 10-char developer team ID
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD — optional fallback auth mode
#                         (appleid.apple.com → App-Specific Passwords)
#
# Trigger paths:
#   - commit message contains [build-ios] → production iOS build
#   - tag v*-ios → production iOS build
#   - workflow_dispatch with profile=production → production
#   - workflow_dispatch with profile=preview → unsigned-distribution
#     internal build for sideload testing
#
# What it does:
#   1. Strip the .hal2001 suffix from ios.bundleIdentifier when
#      building production (same Play-Console-vs-HaL logic as the
#      Android workflow). Preview builds keep the suffix.
#   2. Run `eas-cli build --platform ios --profile <profile>
#      --non-interactive` — EAS handles cert + provisioning,
#      builds on its macOS infra, uploads to Expo's CDN.
#   3. Optionally `eas-cli submit --platform ios --latest
#      --non-interactive` to ship the latest production build
#      to TestFlight (skipped for preview builds and unless
#      [submit-ios] is also in the commit message).

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'claude/**'
      - 'HaL2001'
    tags:
      - 'v*-ios'
    paths-ignore:
      - 'app/**'
      - 'App.tsx'
      - 'assets/**'
      - 'docs/**'
      - 'scripts/**'
      - '__tests__/**'
      - '**.md'
      # Don't fire iOS build for Android-only workflow changes.
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview = sideload, production = TestFlight-ready)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      submit:
        description: 'Submit to TestFlight after build (production only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Tartaria Realms iOS via EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Determine build profile
        id: meta
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Resolution chain:
          #   1. tag v*-ios → production (TestFlight-ready)
          #   2. commit message FIRST LINE STARTS WITH [build-ios] →
          #      production. Strict prefix match so commits like
          #      "Fix iOS workflow false-positive on [build-ios] in
          #      body" don't false-positive production. To intentionally
          #      fire production iOS, title the commit:
          #        [build-ios] OTA-XXX — description
          #        or to also auto-submit to TestFlight:
          #        [build-ios] [submit-ios] OTA-XXX — description
          #   3. workflow_dispatch input → as chosen
          #   4. default → preview (sideload internal build)
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/v*-ios ]]; then
            PROFILE="production"
            SHOULD_SUBMIT="true"
          elif [[ "$FIRST_LINE" =~ ^\[build-ios\] ]]; then
            PROFILE="production"
            # [submit-ios] gates the auto-submit step. Must also be
            # in the first line (anywhere after [build-ios]).
            if [[ "$FIRST_LINE" =~ \[submit-ios\] ]]; then
              SHOULD_SUBMIT="true"
            else
              SHOULD_SUBMIT="false"
            fi
          else
            PROFILE="${{ github.event.inputs.profile || 'preview' }}"
            SHOULD_SUBMIT="${{ github.event.inputs.submit || 'false' }}"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "submit=$SHOULD_SUBMIT" >> "$GITHUB_OUTPUT"
          echo "Building Tartaria Realms iOS — profile: $PROFILE, submit: $SHOULD_SUBMIT"

      - name: Strip .hal2001 suffix for production iOS build
        if: steps.meta.outputs.profile == 'production'
        run: |
          # Mirror the Android workflow's package strip. Production iOS
          # builds use the bare bundle identifier to match the App Store
          # Connect listing; preview/sideload builds keep .hal2001 so
          # HaL test installs stay separate.
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const before = app.expo?.ios?.bundleIdentifier;
            if (app.expo?.ios?.bundleIdentifier?.endsWith('.hal2001')) {
              app.expo.ios.bundleIdentifier = app.expo.ios.bundleIdentifier.slice(0, -'.hal2001'.length);
            }
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Production iOS bundle id:', before, '->', app.expo.ios.bundleIdentifier);
          "
          grep '"bundleIdentifier"' app.json | head -3

      - name: Verify EXPO_TOKEN secret is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is missing."
            echo "::error::Add it at GitHub repo Settings → Secrets and variables → Actions."
            echo "::error::Generate the token at https://expo.dev/accounts/<account>/settings/access-tokens"
            exit 1
          fi
          echo "✓ EXPO_TOKEN is set."

      - name: Write App Store Connect API key (production)
        if: steps.meta.outputs.profile == 'production'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # The App Store Connect API key is what lets EAS authenticate
          # to Apple WITHOUT interactive 2FA — so it can GENERATE the
          # Distribution Certificate + Provisioning Profile on its own
          # during a non-interactive CI build. This is the cloud-only
          # path that removes the need for a one-time local
          # `eas credentials` run on a laptop.
          if [ -z "${ASC_API_KEY_P8:-}" ]; then
            echo "::error::ASC_API_KEY_P8 secret missing — EAS cannot generate iOS credentials non-interactively."
            echo "::error::Create a key at App Store Connect → Users and Access → Integrations → App Store Connect API."
            echo "::error::Add the .p8 file CONTENTS as secret ASC_API_KEY_P8, the Key ID as ASC_KEY_ID, and the Issuer ID as ASC_ISSUER_ID."
            exit 1
          fi
          KEY_DIR="$HOME/.app-store-connect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          # Exported to GITHUB_ENV so the build + submit steps (and
          # eas.json's $ASC_API_KEY_PATH substitution) can read it.
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "✓ ASC API key written."

      - name: EAS Build (iOS, non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # App Store Connect API key auth — lets EAS GENERATE the
          # Distribution Certificate + Provisioning Profile itself,
          # non-interactively, in CI. This is the cloud-only path: no
          # laptop / interactive `eas credentials` run needed. The
          # app-specific password is kept as a fallback auth mode.
          EXPO_ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Profile: ${{ steps.meta.outputs.profile }}"
          # --no-wait returns the moment the build is queued on Expo's
          # macOS workers (no idle GitHub minutes burning during the
          # 20-30 min Xcode work). Build status is visible at
          # https://expo.dev/accounts/hot-attic-games/projects/tartaria-/builds
          npx eas-cli build \
            --platform ios \
            --profile "${{ steps.meta.outputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: EAS Submit to TestFlight (production only, gated)
        if: steps.meta.outputs.profile == 'production' && steps.meta.outputs.submit == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Submit auth via the same App Store Connect API key used for
          # the build. eas.json submit.production.ios reads these through
          # $VAR substitution (ascAppId / ascApiKeyPath / ascApiKeyId /
          # ascApiKeyIssuerId). ASC_API_KEY_PATH comes from GITHUB_ENV
          # (written by the "Write App Store Connect API key" step).
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_APP_ID:-}" ] || [ -z "${ASC_API_KEY_PATH:-}" ]; then
            echo "::warning::ASC_APP_ID or ASC_API_KEY_PATH missing — skipping submit."
            echo "::warning::Build still produced the .ipa on Expo CDN; submit manually from expo.dev or App Store Connect."
            exit 0
          fi
          # Wait for the latest production build to finish before submit.
          # --latest auto-picks the most recent successful build for the
          # production profile.
          npx eas-cli submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive
