name: EAS Update — arbiters-line ISOLATED (test phone only)

# Publishes the arbiters-line JS bundle as an OTA to the 'arbiters-line'
# EAS channel ONLY. The Flint Coil test APK is the only build that listens
# to that channel (its app.json sets expo-channel-name: arbiters-line), so
# this reaches the user's personal test install and NOTHING else.
#
# This is a SEPARATE workflow from eas-update.yml ON PURPOSE. eas-update.yml
# is hardcoded to publish to the LIVE playtester channels (hal2001 / preview
# / ios-preview) on every push. This file must NEVER touch those — it only
# ever knows the string "arbiters-line". Keeping it isolated in its own file
# is the firewall: there is no code path here that can reach a live channel.
#
# Trigger: a JS-bundle (app/**) push to the arbiters-line branch. Native /
# build-config changes are path-ignored here because they need a fresh APK
# (build-apk.yml), not an OTA.

on:
  push:
    branches:
      - arbiters-line
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ota:
    name: Publish isolated arbiters-line OTA (Android, test phone only)
    runs-on: ubuntu-latest
    # Belt-and-suspenders — this job only ever runs for the arbiters-line
    # branch. If anything ever re-points it, it no-ops instead of leaking.
    if: github.ref == 'refs/heads/arbiters-line'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          # Same pin as eas-update.yml — the version known-good against the
          # current Expo backend + the TARTARIATWO token.
          eas-version: 18.1.0
          token: ${{ secrets.TARTARIATWO }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish OTA to the arbiters-line channel ONLY
        env:
          EXPO_TOKEN: ${{ secrets.TARTARIATWO }}
        run: |
          set -euo pipefail
          CHANNEL="arbiters-line"

          # ── HARD FENCE ────────────────────────────────────────────────
          # Refuse to run for any other branch, and refuse to ever name a
          # live playtester channel. Either condition is a hard failure,
          # not a warning — a leak here ships an untested bundle to real
          # testers (exactly the OTA-301 incident we rolled back).
          if [ "${GITHUB_REF_NAME}" != "arbiters-line" ]; then
            echo "::error::Refusing to publish — branch '${GITHUB_REF_NAME}' is not arbiters-line."
            exit 1
          fi
          case "$CHANNEL" in
            hal2001|preview|ios-preview|production|development)
              echo "::error::Refusing to publish to a live channel ('$CHANNEL')."
              exit 1 ;;
          esac
          # ──────────────────────────────────────────────────────────────

          APP_VERSION=$(node -p "require('./app.json').expo.version")
          BUNDLE_CHANNEL=$(node -p "require('./app.json').expo.updates.requestHeaders['expo-channel-name'] || ''")
          if [ "$BUNDLE_CHANNEL" != "arbiters-line" ]; then
            echo "::error::app.json expo-channel-name is '$BUNDLE_CHANNEL', not 'arbiters-line' — the test APK would not receive this. Aborting to avoid a stray publish."
            exit 1
          fi
          MSG="Tartaria OTA (isolated) — arbiters-line@${GITHUB_SHA::7} (run #${{ github.run_number }})"

          echo "=== Isolated OTA — pre-flight ==="
          echo "Branch:           ${GITHUB_REF_NAME}"
          echo "Channel:          $CHANNEL (test phone only — NOT hal2001/preview)"
          echo "App version (rt): $APP_VERSION"
          echo "================================="

          set +e
          eas update \
            --branch "$CHANNEL" \
            --message "$MSG" \
            --platform android \
            --non-interactive \
            --json > result.json
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::Publish to '$CHANNEL' failed (exit $rc)."
            cat result.json 2>/dev/null || true
            exit $rc
          fi

          # Map the channel to its same-named branch (idempotent) so the
          # APK's 'expo-channel-name: arbiters-line' header resolves here.
          eas channel:view "$CHANNEL" --non-interactive >/dev/null 2>&1 \
            || eas channel:create "$CHANNEL" --non-interactive 2>&1 || true
          eas channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive 2>&1 \
            || echo "::warning::channel:edit failed for '$CHANNEL' — check the EAS dashboard mapping."

          # Runtime guard — the installed Flint Coil APK requests
          # runtimeVersion = app version; a mismatch silently no-ops.
          PUB_RT=$(node -e "const r=JSON.parse(require('fs').readFileSync('result.json','utf8'));const a=Array.isArray(r)?r:[r];console.log(a[0]&&a[0].runtimeVersion||'')")
          if [ "$PUB_RT" != "$APP_VERSION" ]; then
            echo "::error::Published runtimeVersion '$PUB_RT' != app '$APP_VERSION' — the test APK will reject it."
            exit 1
          fi
          echo "✓ Published OTA to '$CHANNEL' (android) at runtimeVersion $PUB_RT — reaches the Flint Coil test install only."
